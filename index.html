<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="酷比摩程式課：程式訓練、冒險模式、創作工坊三大項目的 3D 方塊程式遊戲，可切換中英文。Qubimo Code Lab: block coding training, an RPG adventure and a creative workshop in a 3D block world.">
<title>酷比摩程式課</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700;900&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: lesson + pixel world on the left, block bench + live code on the right; stacks on phones */
:root{
  --bg:#E7EEE4; --surface:#F6FAF4; --surface-2:#EDF3EA; --ink:#17231B; --muted:#56675B; --line:#C8D5C3;
  --accent:#2B7A4A; --accent-ink:#FFFFFF; --warn:#B4441E; --ok:#2B7A4A; --gold:#D9A21F;
  --frame:#1E2721; --frame-line:#34413A;
  --code-bg:#18211C; --code-fg:#DCE6DE; --code-dim:#6E8275; --c-kw:#E59BD8; --c-fn:#8CC8FF; --c-num:#F6C177; --c-const:#7FE0B5; --c-var:#DCE6DE;
  --dot:#C9D6C5;
  --b-move:#2F6FD6; --b-turn:#6A55C9; --b-loop:#1E8F54; --b-build:#C26A1A; --b-logic:#0F7E86; --b-var:#B8387E; --b-func:#9A6A0E;
  --f-display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-pixel:"Silkscreen","Courier New",monospace;
  --f-code:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101612; --surface:#18201B; --surface-2:#1E2822; --ink:#E2EBE0; --muted:#97A99B; --line:#2D3B32;
  --accent:#55B97D; --accent-ink:#0D1A12; --warn:#F08A5D; --ok:#55B97D; --gold:#F0C04A;
  --frame:#0B100D; --frame-line:#26322B; --dot:#26332B; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#101612; --surface:#18201B; --surface-2:#1E2822; --ink:#E2EBE0; --muted:#97A99B; --line:#2D3B32;
  --accent:#55B97D; --accent-ink:#0D1A12; --warn:#F08A5D; --ok:#55B97D; --gold:#F0C04A;
  --frame:#0B100D; --frame-line:#26322B; --dot:#26332B; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:16px 40px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px}
.brand{display:flex;align-items:center;gap:12px}
.brand canvas{width:44px;height:44px;image-rendering:pixelated;filter:drop-shadow(0 3px 3px rgba(0,0,0,.18))}
.brand h1{font-family:var(--f-display);font-weight:900;font-size:1.45rem;margin:0;line-height:1.2;letter-spacing:.02em}
.brand p{margin:0;color:var(--muted);font-size:.85rem}
.levels{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;width:100%}
.ch-gap{width:6px}
.lv{width:40px;height:48px;border:2px solid var(--line);background:var(--surface);border-radius:8px;box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.lv b{font-family:var(--f-pixel);font-size:1.05rem;line-height:1}
.lv i{font-style:normal;font-size:.62rem;letter-spacing:-1px;color:var(--gold);min-height:.9em;line-height:1}
.lv.cur{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.lv:hover{transform:translateY(-1px)}.lv:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.lv-group{display:flex;flex-direction:column;gap:3px}
.lv-ch{font-size:.68rem;font-weight:700;color:var(--muted);letter-spacing:.06em;padding-left:2px;white-space:nowrap}
.lv-row{display:flex;gap:4px}
.lv.wide{width:auto;padding:0 12px}
.lv .bn{font-family:var(--f-body);font-size:.9rem;font-weight:900}
.examples{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:700;font-size:.9rem}
.ex-btn{padding:4px 12px;font-size:.85rem}
.ex-btn.warn{border-color:var(--warn);color:var(--warn)}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.stage.edit .world{order:-1}
.layout.explore{grid-template-columns:minmax(0,1fr)}
.stage.explore{display:grid!important;grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr);align-items:start}
.stage.explore .world{order:-1}
.stage.explore .drag-tip{display:none}
@media (max-width:920px){.stage.explore{grid-template-columns:minmax(0,1fr)}}
.dpad{position:absolute;inset:auto 10px 10px 10px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.dpad .dirs{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,40px);gap:4px;pointer-events:auto}
.dpad .dirs button:nth-child(1){grid-column:2;grid-row:1}.dpad .dirs button:nth-child(2){grid-column:1;grid-row:2}.dpad .dirs button:nth-child(3){grid-column:2;grid-row:2}.dpad .dirs button:nth-child(4){grid-column:3;grid-row:2}
.dpad button{border:0;border-radius:10px;background:rgba(16,24,19,.62);color:#fff;font-weight:900;font-size:1rem;touch-action:none;user-select:none;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.dpad button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.dpad .act{pointer-events:auto;width:58px;height:58px;border-radius:50%;background:rgba(43,122,74,.85);font-family:var(--f-pixel);font-size:1.2rem}
.adv-stats{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.adv-lv{font-family:var(--f-pixel);font-size:.85rem;color:var(--muted)}.adv-lv b{font-size:1.6rem;color:var(--accent);font-family:var(--f-display)}
.adv-xp .bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.adv-xp .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold))}
.adv-xp span{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.adv-cry{display:flex;gap:5px}.cry{width:16px;height:16px;transform:rotate(45deg);border-radius:3px;background:var(--line);border:1px solid rgba(0,0,0,.12)}
.cry.on.c-forest{background:#4FCF6B}.cry.on.c-snow{background:#7FDDF5}.cry.on.c-volcano{background:#FF7A3C}.cry.on{box-shadow:0 0 8px currentColor}
.adv-talk{background:color-mix(in srgb,var(--gold) 14%,var(--surface));border:2px solid var(--gold);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.adv-talk p{margin:0;line-height:1.65}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.adv-talk.bubble.nudge{animation:nudge .25s}
.adv-talk.bubble{position:absolute;left:12px;right:60px;top:12px;max-width:520px;box-shadow:0 8px 20px rgba(10,20,14,.3);font-size:.92rem;z-index:2;animation:pop .25s ease-out both}
.adv-sec{display:flex;flex-direction:column;gap:4px}
.adv-q{margin:0;padding-left:18px;font-size:.9rem}.adv-q li{margin:2px 0}.adv-q li.done{color:var(--ok);text-decoration:line-through}
.adv-items{display:flex;flex-wrap:wrap;gap:6px}.adv-item{display:inline-flex;gap:6px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:.85rem;font-weight:700}
.adv-item b{font-family:var(--f-pixel)}
.ed-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:700;font-size:.9rem}
.ed-input{font:inherit;font-weight:500;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:6px;padding:4px 8px;min-width:0}
#edName{flex:1 1 140px}
.ed-input.num{width:5em}
.ed-tools{display:flex;flex-wrap:wrap;gap:6px}
.ed-tool{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface-2);border-radius:6px;padding:4px 10px 4px 5px;font-weight:700;font-size:.85rem}
.ed-tool.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.ed-tool .sw{width:22px;height:22px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;color:#fff}
.ed-grid{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:2px;width:100%;max-width:380px;background:var(--frame);padding:4px;border-radius:6px;touch-action:none;user-select:none}
.ed-cell{aspect-ratio:1;border:0;border-radius:2px;padding:0;font-size:clamp(.6rem,2.6vw,1rem);line-height:1;color:#fff;cursor:pointer;min-width:0}
.ed-cell:hover{outline:2px solid #fff;outline-offset:-2px}
.t-g{background:#5BA04A}.t-T{background:#2F6E2C}.t-S{background:#8E949A}.t-W{background:#2D72C4}.t-L{background:#D9471A}
.t-G{background:#5BA04A;color:#7FF1F8!important;text-shadow:0 0 2px #0D5E66}.t-R{background:#5BA04A;color:#fff!important;text-shadow:0 1px 1px #1A2632;font-weight:900}
.ed-tip{margin:0;color:var(--muted);font-size:.82rem;font-weight:500}
.ed-check{margin:0;font-weight:700;font-size:.88rem}
.ed-check.good{color:var(--ok)}.ed-check.bad{color:var(--warn)}
.ed-blocks{border:1px solid var(--line);border-radius:6px;display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 12px;margin:0;font-size:.88rem}
.ed-blocks legend{font-weight:700;padding:0 4px}
.ed-blocks label{display:inline-flex;gap:4px;align-items:center}
.ed-share{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ed-share textarea{width:100%;font-family:var(--f-code);font-size:.78rem;border:2px solid var(--line);border-radius:6px;background:var(--surface-2);color:var(--ink);padding:6px;word-break:break-all;resize:vertical}
@media (max-width:440px){.levels{gap:4px}.ch-gap{width:4px}.lv{width:38px;height:44px}}
.lv.cur i{color:var(--accent-ink)}

.layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:920px){.layout{grid-template-columns:minmax(0,1fr)}}

/* lesson */
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 14px rgba(20,40,28,.06);padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--f-pixel);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.chip.concept{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-family:var(--f-body);font-weight:700;letter-spacing:.1em}
.lesson h2{font-family:var(--f-display);font-weight:900;font-size:1.6rem;margin:0;line-height:1.25;text-wrap:balance}
.goal{margin:0;font-weight:700}
.goal span{color:var(--accent)}
.explain{margin:0;color:var(--muted);max-width:62ch}
details.hint{border-top:1px dashed var(--line);padding-top:8px}
details.hint summary{cursor:pointer;font-weight:700;color:var(--accent);width:max-content}
details.hint p{margin:6px 0 0;max-width:62ch}
details.sol{margin-top:2px}
.sol-warn{color:var(--muted);font-size:.85rem}
.sol-list{margin-top:8px;display:flex;flex-direction:column;gap:3px;font-size:.85rem}
.sol-row{display:flex;align-items:center;gap:4px}
.sol-blk{display:inline-flex;align-items:center;gap:6px;color:#fff;border-radius:6px;padding:3px 9px;font-weight:700;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);text-shadow:0 1px 0 rgba(0,0,0,.18)}
.sol-blk .ico{font-size:.8rem}
.sol-body{margin-left:18px;padding-left:8px;border-left:3px solid var(--line);display:flex;flex-direction:column;gap:3px}
.sol-fn{color:var(--accent);font-weight:900;font-size:.85rem}
.sol-notes{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:.88rem;max-width:62ch}
.sol-notes b{color:var(--accent);margin-right:2px}
.sol-count{font-size:.8rem;color:var(--muted)}
.teach{background:color-mix(in srgb,var(--accent) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.teach p{margin:0;max-width:62ch}.teach-h{font-weight:800;color:var(--accent)}

/* world */
.world{background:linear-gradient(180deg,color-mix(in srgb,var(--frame) 85%,#3A5A44),var(--frame));border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--frame-line);box-shadow:0 10px 24px rgba(10,20,14,.18)}
.canvas-box{border-radius:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.canvas-box{position:relative;display:flex;justify-content:center;overflow:hidden}
#world{display:block;max-width:100%;border-radius:8px;touch-action:pan-y;cursor:grab}
#world:active{cursor:grabbing}
.view-ctl{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.view-ctl button{background:rgba(16,24,19,.72);color:#fff;border:0;border-radius:4px;padding:4px 9px;font-size:.8rem;font-weight:700}
.view-ctl button:hover{background:rgba(16,24,19,.9)}
.canvas-box.full{position:fixed;inset:0;z-index:200;border-radius:0;background:#0E1511;align-items:center}
.fs-bar{position:absolute;left:10px;top:8px;display:none;gap:6px;z-index:3}
.canvas-box.full .fs-bar{display:flex}
.canvas-box.full .drag-tip{display:none}
.fs-bar .btn{padding:6px 14px}
.fs-hud{background:rgba(16,24,19,.72);color:#fff;border-radius:6px;padding:6px 10px;font-size:.85rem;font-weight:700;display:flex;align-items:center}
.drag-tip{position:absolute;left:8px;bottom:8px;background:rgba(16,24,19,.6);color:#E9F0EA;font-size:.72rem;padding:2px 8px;border-radius:3px;pointer-events:none}
.hud{display:flex;flex-wrap:wrap;gap:6px;font-family:var(--f-pixel);font-size:.78rem;color:#C7D3CA;letter-spacing:.04em}
.hud > span{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:3px 11px}
.hud b{color:#FFFFFF;font-weight:700}
.status{min-height:1.6em;font-size:.92rem;color:#E9F0EA;font-weight:500}
.status.bad{color:#FF9B73}
.status.good{color:#7FE0A6}

.bench-wrap{display:flex;flex-direction:column;min-width:0}
@media (min-width:921px){
  .layout:not(.explore){align-items:stretch}
  .layout:not(.explore) .bench{position:relative;min-height:600px}
  .layout:not(.explore) .bench-wrap{position:absolute;inset:0}
  .layout:not(.explore) .bench-grid{flex:1;min-height:0}
  .layout:not(.explore) .palette,.layout:not(.explore) .program-area{overflow:auto;min-height:0}
  .layout:not(.explore) .code{flex:0 0 auto;max-height:34%;min-height:0}
  .layout:not(.explore) pre.src{flex:1;min-height:0;overflow:auto}
}
.lv .md{font-style:normal;font-size:.62rem;line-height:1;position:absolute;top:2px;right:2px}.lv .md.ck{color:var(--ok);font-weight:900}
.lv{position:relative}
.lv-sum{align-self:center;font-weight:800;font-size:.85rem;color:var(--muted);padding:0 6px;white-space:nowrap}
.medal{color:#B8860B!important;font-weight:800}
.perk-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.perk-list li{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:start;padding:6px 8px;border-radius:8px;background:var(--surface-2)}
.perk-list li.off{opacity:.55}.perk-list b{font-family:var(--f-code);font-size:.8rem;white-space:nowrap}
.warp-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.lesson-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.lesson-btns .btn{padding:6px 12px;font-size:.88rem}
.modal{position:fixed;inset:0;z-index:300;background:rgba(10,16,12,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-card{background:var(--surface);color:var(--ink);border-radius:14px;max-width:580px;width:100%;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.35);animation:pop .25s ease-out both}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-family:var(--f-display);font-weight:900;font-size:1.2rem;flex:1}
.modal-x{border:0;background:var(--surface-2);color:var(--ink);border-radius:8px;width:34px;height:34px;font-size:1rem;font-weight:700;cursor:pointer}
.modal-body{padding:14px 18px 18px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.modal-body p{margin:0}
.result{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,16,12,.72);padding:12px}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.04);opacity:1}100%{transform:scale(1)}}
@keyframes starIn{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.result-card{animation:pop .35s ease-out both}
.stars{display:inline-block;animation:starIn .5s .15s cubic-bezier(.3,1.6,.5,1) both}
.result-card{background:var(--surface);color:var(--ink);border-radius:14px;padding:20px 22px;text-align:center;max-width:320px;width:100%;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.result-card h3{margin:0;font-family:var(--f-display);font-weight:900;font-size:1.4rem}
.stars{font-size:2rem;letter-spacing:6px;color:var(--gold);line-height:1}
.stars .off{color:var(--line)}
.result-card p{margin:0;color:var(--muted);font-size:.9rem}
.result-card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* bench */
.bench{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 4px 14px rgba(20,40,28,.06);display:flex;flex-direction:column;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.btn{border:2px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 14px;font-weight:700;font-size:.9rem;box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.primary{box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.primary.stop{box-shadow:0 3px 0 color-mix(in srgb,var(--warn) 60%,#000)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);padding:6px 20px;font-size:1rem}
.btn.primary.stop{background:var(--warn);border-color:var(--warn);color:#fff}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.toolbar .spacer{flex:1}
.lang-btn{padding:5px 12px;font-size:.85rem;align-self:center;white-space:nowrap;flex:none}
.top-tools{display:flex;gap:6px;flex-wrap:wrap;margin-left:6px}
.lang-btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.lang-btn[aria-pressed="false"]{color:var(--muted)}
.sections{display:flex;gap:10px;flex-wrap:wrap;width:100%}
.sec{flex:1 1 200px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 16px;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;gap:2px;transition:transform .08s}
.sec:hover{transform:translateY(-1px)}.sec:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.sec b{font-size:1.08rem;font-family:var(--f-display);font-weight:900}.sec span{font-size:.8rem;color:var(--muted)}
.sec.cur{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000)}

<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <canvas id="logo" width="32" height="32" aria-hidden="true"></canvas>
      <div>
        <h1 data-i18n="title">酷比摩程式課</h1>
        <p data-i18n="subtitle">拼積木、看程式碼，帶機器人「比維」挖寶石、蓋房子</p>
      </div>

    </div>
    <nav class="sections" id="sections" role="tablist" aria-label="項目"></nav>
    <nav class="levels" id="levels" aria-label="關卡" data-i18n-aria="levelsAria"></nav>
  </header>

  <main class="layout">
    <section class="stage" id="stage" style="display:flex;flex-direction:column;gap:16px;min-width:0">
      <article class="lesson" id="lesson"></article>
      <div class="world">
        <div class="canvas-box" id="canvasBox">
          <canvas id="world" aria-label="3D 方塊世界地圖" data-i18n-aria="worldAria"></canvas>
          <div class="view-ctl"><button id="rotL" aria-label="向左旋轉視角" data-i18n-aria="rotL">↺</button><button id="rotR" aria-label="向右旋轉視角" data-i18n-aria="rotR">↻</button><button id="zoomIn" aria-label="放大" data-i18n-aria="zoomIn">＋</button><button id="zoomOut" aria-label="縮小" data-i18n-aria="zoomOut">－</button><button id="fullBtn" aria-label="全螢幕" data-i18n-aria="fullOn">⛶</button></div>
          <div class="fs-bar"><button class="btn primary" id="fsRun">▶</button><span class="fs-hud" id="fsHud"></span></div>
          <span class="drag-tip" data-i18n="dragTip">左右拖曳可旋轉視角</span>
          <div class="adv-talk bubble" id="talkBubble" hidden aria-live="polite"></div>
          <div class="dpad" id="dpad" hidden><div class="dirs"><button data-pad="up" aria-label="up">▲</button><button data-pad="left" aria-label="left">◀</button><button data-pad="down" aria-label="down">▼</button><button data-pad="right" aria-label="right">▶</button></div><button class="act" data-pad="act" aria-label="interact">A</button></div>

        </div>
        <div class="hud">

          <span><span data-i18n="steps" id="hStepLbl">步數</span> <b id="hStep">0</b></span>
          <span><span data-i18n="wood" id="hWoodLbl">木頭</span> <b id="hWood">0</b></span>
          <span id="hInvBox" hidden><span data-i18n="inv">背包</span> <b id="hInv"></b></span>
          <span id="hVars" hidden><span data-i18n="vars">變數</span> <b id="hVarVal"></b></span>
        </div>
        <div class="status" id="status" aria-live="polite"></div>
      </div>
    </section>

    <section class="bench" aria-label="程式工作台" data-i18n-aria="benchAria"><div class="bench-wrap">
      <div class="toolbar">
        <button class="btn primary" id="runBtn">▶ 執行</button>
        <button class="btn" id="resetBtn" data-i18n="reset">重設地圖</button>
        <button class="btn" id="clearBtn" data-i18n="clear">清空積木</button>
        <button class="btn" id="speedBtn" aria-pressed="false">速度：一般</button>
        <span class="spacer"></span>
        <span class="count"><span data-i18n="blocksPre">積木</span> <b id="bCount">0</b> <span data-i18n="blocksPost">塊</span></span>
      </div>
      <div class="bench-grid">
        <div class="palette" id="palette"></div>
        <div class="program-area">
          <div class="prog-head">
            <p class="prog-title" data-i18n="myProgram">我的程式</p>
            <span class="challenge" id="challenge"></span>
          </div>
          <div id="program"></div>

      <div class="code">

    </div></section>
  </main>
  <p class="foot-note" data-i18n="footNote">點左側「積木箱」把積木加入程式；虛線框標示新積木會放在哪裡。進度只存在這台裝置的瀏覽器裡。</p>
  <div class="modal" id="modal" hidden><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">

    <div class="modal-body" id="modalBody"></div></div></div>
  <details class="about"><summary data-i18n="aboutTitle">關於與授權</summary><div id="aboutBody"></div></details>

<script>
(()=>{
/* ---------- levels ---------- */
const PB=["forward","left","right","up","down","build","digAt","repeat","setVar","changeVar","forwardV"];
const field=(n,sx,sz)=>Array.from({length:n},(_,y)=>Array.from({length:n},(_,x)=>x===sx&&y===sz?"R":".").join(""));
const BUILD_MAP=field(14,4,4);
const P8=["forward","left","right","combo","repeat","until","if","ifElse","place","dig","func","call"];
const P1=["forward"],P2=[...P1,"left","right"],P3=[...P2,"repeat"],P4=[...P3,"place","combo"],P5=[...P4,"dig"],P6=[...P5,"if"],P7=[...P6,"setVar","changeVar","forwardV"];
const LEVELS=[
 {ch:"基礎",name:"第一步",concept:"序列",palette:P1,dir:1,optimal:3,
  map:["TTTTTTT","T.....T","TR..G.T","T.....T","TTTTTTT"],
  goal:"讓比維走到寶石上",
  explain:"程式是一串照順序執行的指令。比維會從最上面的積木開始，一塊一塊往下做。",
  hint:"寶石在正前方 3 格。放 3 塊「前進 1 格」就到了。",
  code:"每一塊積木都對應一行程式，例如「前進」就是 robot.forward()。"},
 {ch:"基礎",name:"轉個彎",concept:"方向",palette:P2,dir:1,optimal:8,
  map:["TTTTTTT","TR..TTT","TTT.TTT","TTT..GT","TTTTTTT"],
  goal:"沿著小路轉彎，拿到寶石",
  explain:"轉向只會改變比維面對的方向，不會移動位置。看清楚比維的眼睛朝哪邊，再決定往左或往右。",
  hint:"前進 2、右轉、前進 2、左轉、前進 2。",
  code:"轉向用 robot.turn(LEFT) 或 robot.turn(RIGHT)，括號裡的值叫做「參數」。"},
 {ch:"基礎",name:"之字山路",concept:"方向",palette:P2,dir:1,optimal:9,
  map:["TTTTTT","TR.TTT","TT.GTT","TTT.GT","TTTTTT"],
  goal:"左右交替轉彎，拿到 2 顆寶石",
  explain:"這條路一下往右、一下往左。轉向之前先想：比維現在面向哪裡？轉完之後會面向哪裡？",

  code:"記下你用了幾塊積木。下一章學會迴圈後，可以用更少的積木走類似的路。"},
 {ch:"迴圈",name:"長長的走廊",concept:"迴圈",palette:P3,dir:1,optimal:2,

 {ch:"迴圈",name:"樓梯小徑",concept:"迴圈",palette:P3,dir:1,optimal:5,
  map:["TTTTTTTT","TR.TTTTT","TT.GTTTT","TTT..TTT","TTTT.GTT","TTTTTGTT","TTTTTTTT"],

 {ch:"建造與挖掘",name:"搭一座橋",concept:"建造",palette:P4,dir:1,optimal:5,

 {ch:"建造與挖掘",name:"岩漿河",concept:"建造",palette:P4,dir:1,optimal:5,

 {ch:"建造與挖掘",name:"石頭礦坑",concept:"挖掘",palette:P5,dir:1,optimal:7,

 {ch:"條件與巢狀",name:"看情況做事",concept:"條件",palette:P6,dir:1,optimal:6,

 {ch:"條件與巢狀",name:"沿著牆走",concept:"條件",palette:P6,dir:1,optimal:4,

 {ch:"條件與巢狀",name:"繞場一圈",concept:"巢狀迴圈",palette:P6,dir:1,optimal:4,

  adv_keepExploring:"繼續探索",adv_term:"程式石碑",adv_done:"已解開",adv_blocksFrom:"可用的積木來自你的道具：建造手套、鐵鎬、指南針、魔法書、卷尺、B 頁、回音貝都會解鎖新的積木。",

  t_chief0:"比維，你終於醒了！晨光村的燈塔熄滅了，要找回<b>森林、雪原、火山</b>的三顆晶石才能重新點亮。<br>先到河邊的<b>程式石碑</b>修好東橋吧。這副<b>建造手套</b>送你，它能解鎖「放方塊」積木。",
  t_chief1:"東橋在村子東邊的河上。走到河邊的石碑前，按互動鍵就能寫程式修橋。",
  t_chief2:n=>`東橋修好了，做得好！晶石已經找回 ${n} 顆。森林裡的獵人老柯好像需要幫忙。`,
  t_chiefEnd:"你找回了三顆晶石！看，燈塔重新亮起來了！謝謝你，比維，你是晨光村的英雄！",t_chiefAfter:"燈塔的光真漂亮。外面的世界還等著你，有空回來看看！",
  t_kid0:"嗨！村長在找你喔，她就在路口那邊。",t_kid1:"小祕密：撿寶石可以拿經驗值，升級後北邊的哨兵才會讓你過去！",
  t_hunter0:"旅行者，幫幫我！我在森林裡弄丟了寶石。幫我找回 <b>3 顆</b>，我就把我的<b>鐵鎬</b>送你。",
  t_hunter1:n=>`已經找到 ${n} 顆了，還差一點！森林的空地和小路上都找找看。`,
  t_hunterDone:"太好了，謝謝你！這把<b>鐵鎬</b>給你，它能解鎖「挖掘」積木。西南邊的林道石碑需要它。",t_hunterAfter:"鐵鎬好用嗎？林道石碑就在南邊的樹牆旁。",
  t_guard:l=>`停下！北邊的雪原很危險。等你到了 <b>Lv 2</b> 再來（現在 Lv ${l}）。`,t_guardOk:"你看起來夠強了，雪原的路為你打開。小心冰面會滑！",
  t_sage0:"孩子，帶上這個<b>指南針</b>吧。它能解鎖「如果」和「重複直到」，讓你在神殿的迴旋小路裡不會迷路。",t_sage1:"記住：前面被擋住就轉彎，否則就往前走。",
  t_farmer0:"哎呀，我種菜的時候把村裡的寶石弄丟了！幫我找回 <b>5 顆</b>好嗎？河的東岸好像也掉了幾顆。",
  t_farmer1:n=>`已經找到 ${n} 顆了，再找找看！房子後面、池塘邊、河對岸都有可能。`,
  t_farmerDone:"全部找到了！謝謝你，這些經驗值是給你的謝禮（+40 XP）。",t_farmerAfter:"今年的菜一定長得很好。你在村裡走走，會發現很多小角落。",
  t_wood0:"這片森林很大喔！北邊的小路通往雪原，東邊的鐵閘門要用鑰匙才打得開。聽說鑰匙藏在雪原的寶箱裡。",
  t_wood1:"你拿到鑰匙了？那就去東邊的鐵閘門吧，閘門後面就是火山。",
  t_ranger:"我在雪原巡邏好多年了。冰湖中間有一顆寶石，四個角落也有東西在發光，慢慢找。",
  t_miner0:"哇，你竟然搭橋過了熔岩！這裡的礦脈很少人來過。這些經驗值給你（+30 XP），附近的寶石也都歸你了。",
  t_miner1:"火山東邊的礦脈閃閃發光，小心別掉進熔岩裡。",
  n_farmer:"農夫阿禾",n_woodcutter:"樵夫阿松",n_ranger:"雪原巡山員",n_miner:"礦工老鐵",
  q_farmer:n=>`幫農夫找回村裡的寶石（${n}/5）`,adv_effect_p5:"熔岩上出現一座石橋，可以前往火山東邊的礦脈。",
  it_tape:"卷尺",it_pageB:"魔法書 B 頁",it_pearl:"潮汐珍珠",it_core:"礦心寶石",it_star:"星之核心",ic_tape:"↔",ic_pageB:"B",ic_pearl:"◉",ic_core:"◆",ic_star:"★",
  n_shipwright:"造船師阿漁",n_captain:"船長海伯",n_tidegirl:"觀潮少女小汐",n_minechief:"老礦長",n_geologist:"地質學家岩姐",n_cartkid:"礦車少年小軌",n_warden:"星之守護者",n_astronomer:"觀星婆婆",n_altar:"星之祭壇",n_chapter:"新的章節",
  ch_coast:"<b>第二章：潮汐海岸</b><br>燈塔的光照亮了西邊的海岸，一艘船擱淺在南邊的小島。這一章要學的是<b>變數</b>：先去找造船師阿漁。",
  ch_mine:"<b>第三章：深岩礦坑</b><br>潮汐珍珠在黑暗中發光，照出礦坑深處的路。這一章要學的是<b>更進階的函式</b>：兩個函式、函式裡的判斷、函式加變數。先去找老礦長。",
  ch_temple:"<b>第四章：星光神殿</b><br>這是最後的試煉。神殿裡的石碑會考你<b>除錯</b>、<b>冰面與機關</b>，以及把學過的全部組合起來。先和星之守護者說話。",
  t_chiefCh2:"燈塔的光照向西邊的海岸，好像有船在那裡求救！村子<b>西邊的路</b>已經打通了，去看看吧。",
  t_ship0:"你就是點亮燈塔的比維吧！這把<b>卷尺</b>送你，它能解鎖三塊<b>變數</b>積木：<br>・<b>設定變數</b>：把一個數字放進有名字的盒子<br>・<b>前進 變數 格</b>：照盒子裡的數字前進<br>・<b>改變變數</b>：把盒子裡的數字加或減<br>北邊沙丘有棧橋石碑，西邊有潮池石碑，先從那裡練習。",
  t_ship1:"變數就是會變的數字。棧橋石碑教你「放進去、拿出來用」，潮池石碑教你「每次加一點」。",
  t_cap0:"我的船擱淺在南邊的小島上，珍珠還在船上的寶箱裡……我旁邊的燈標石碑可以搭出棧橋，但它要等棧橋石碑和潮池石碑都解開才會醒來。",
  t_cap1:"棧橋搭好了！快去小島上的寶箱拿<b>潮汐珍珠</b>。",
  t_capAfter:"珍珠會在黑暗裡發光。帶著它往北，懸崖下的洞穴就會為你打開。",
  t_tide0:"潮池的路是一圈一圈往外繞的，每一段都比上一段長 1 格。如果每轉一次彎，就把步數加 1 呢？",
  t_tide1:"你學會「改變變數」了！燈標石碑的缺口一個比一個寬，試試用變數當「重複」的次數。",
  adv_chest_pearl:"寶箱裡有一顆閃閃發亮的<b>潮汐珍珠</b>！<b>第二章完成！</b>北邊懸崖的洞穴打開了。+65 XP",
  t_mc0:"年輕人，你帶著珍珠來了！這是魔法書遺失的<b>B 頁</b>。有了它，你可以定義第二個函式 <b>B</b>。<br>一個函式負責一件事：A 搭橋、B 挖隧道，主程式只要叫它們做事就好。西邊的雙道石碑最適合練習。",
  t_mc1:"記得：一個函式只做一件事。名字取得好，主程式就像一份工作清單。",
  t_geo0:"礦心寶石藏在東南邊的石碑裡。那座石碑要等雙道石碑和環道石碑都解開才會醒來，而且要同時用到<b>函式</b>和<b>變數</b>。",
  t_geo1:"你拿到礦心寶石了！北邊的通道通往星光神殿。",
  t_cart:"東邊的環道石碑好難！不過我發現：函式裡也可以放「如果」，這樣同一個函式遇到水會搭橋、遇到石頭會挖掉。",
  t_warden0:"歡迎來到星光神殿。這裡有三座石碑：西邊的<b>除錯石碑</b>、東邊的<b>冰門石碑</b>，解開它們後，北邊的<b>星核石碑</b>才會醒來。",
  t_wardenEnd:"星之核心回到祭壇上了……整座神殿都亮起來了！比維，你已經是真正的程式高手了！",
  t_astro0:"除錯的祕訣：先執行，看比維在哪裡出錯；一次只改一個地方。除錯石碑的程式有兩個錯誤喔。",
  t_astro1:"冰面會一直滑，壓力板每踩一次就切換一次閘門。踩兩次會怎樣呢？",
  adv_lockPearl:"洞口被大石頭擋住了，好像需要能在黑暗中發光的東西……",adv_lockCore:"通道被岩壁封住了，需要礦心寶石的力量。",
  sign_cave:"告示牌：「往北 → 懸崖洞穴。需要潮汐珍珠。」",sign_temple:"告示牌：「往北 → 星光神殿。需要礦心寶石。」",
  adv_needPuz:l=>`石碑還在沉睡。先解開：<b>${l}</b>。`,adv_must:l=>`這座石碑要求使用：${l}。加進程式後再執行。`,adv_newIdea:"新觀念：",adv_firstSolve:"石碑亮起綠光，你學會了新的技巧！",

  adv_gotToken:n=>`取得<b>${n}</b>！`,adv_effect_c3:"棧橋從海灘延伸到南邊的小島了！",adv_altarOn:"星之核心在祭壇上閃耀，光柱直通天空。",adv_altarOff:"祭壇上的凹槽是空的，好像在等待什麼。",

  ch_canyon:"<b>第五章：回音峽谷</b><br>神殿東邊的門通往一座會回音的峽谷。這一章要學的是<b>計數器</b>：用變數數一數走了幾步、記住量到的長度，再拿來使用。先去找回音守人。",
  ch_sky:"<b>第六章：雲上天空城</b><br>回音水晶喚醒了雲上的城市。最後一章要學的是<b>演算法</b>：寫出一套規則，讓同一個程式能走完很長的路、通過不同的地圖，而且積木數有上限。",
  t_wardenAfter:"神殿東邊的門打開了，那裡通往回音峽谷。<b>第五章</b>正在等你！",
  t_ek0:"你聽，峽谷會把聲音傳回來……這個<b>回音貝</b>送你。有了它，變數積木裡會多一個變數「<b>次數</b>」。<br>一個變數記一件事：「步數」和「次數」可以同時記兩個不同的數字。",
  t_ek1:"記住：先歸零，每走一步加 1，走完就知道走了幾步。這就是計數器。",
  t_nomad0:"北邊的量橋石碑很有意思：河的寬度剛好等於走廊的長度。先量，再搭！",t_nomad1:"雙聲石碑要記兩段路。回程就像倒帶：最後走的那段，最先走回來。",
  t_sandy:"我發現：用「重複直到」走回去會走過頭，因為起點後面還有路！所以要先數好步數。",
  t_lord0:"歡迎來到雲上天空城。這裡的石碑不比誰寫得長，而是比誰的規則聰明：<b>積木數有上限</b>，而且有的石碑要用同一個程式通過<b>兩張地圖</b>。",
  t_lordEnd:"天空之心回來了！整座城市重新飄浮起來。比維，你已經從第一步走到了演算法，是真正的傳說程式師！",t_lordAfter:"謝謝你，比維。所有的地方都可以自由探索，去看看還有沒有漏掉的寶石吧！",

  adv_chest_pearl:"A shimmering <b>Tide Pearl</b> is in the chest! <b>Chapter 2 complete!</b> The cave in the northern cliffs is open. +65 XP",

  t_geo1:"You have the Core Gem! The passage north leads to the Starlight Temple.",
  t_cart:"The Ring Track Stone to the east is so hard! But I found out you can put “if” inside a function, so the same function bridges water and digs through stone.",
  t_warden0:"Welcome to the Starlight Temple. There are three stones: the <b>Debug Stone</b> to the west and the <b>Ice Gate Stone</b> to the east. Once both are solved, the <b>Star Core Stone</b> to the north will wake.",

const LEVELS_EN=[
 {ch:"Basics",name:"First Steps",concept:"Sequence",goal:"Walk Bitwick onto the gem",
  explain:"A program is a list of instructions that run in order. Bitwick starts at the top block and works down, one block at a time.",
  hint:"The gem is 3 steps straight ahead. Use 3 “move 1 step” blocks.",
  code:"Every block matches one line of code. “move 1 step” is robot.forward()."},
 {ch:"Basics",name:"Round the Bend",concept:"Direction",goal:"Follow the path around the corners to the gem",
  explain:"Turning only changes which way Bitwick faces. It doesn't move Bitwick. Check which way Bitwick's eyes point before you pick left or right.",
  hint:"Move 2, turn right, move 2, turn left, move 2.",
  code:"Turns are robot.turn(LEFT) and robot.turn(RIGHT). The value inside the brackets is called an argument."},
 {ch:"Basics",name:"Zigzag Trail",concept:"Direction",goal:"Alternate left and right turns to collect 2 gems",
  explain:"This trail switches between right and left. Before each turn, ask: which way is Bitwick facing now, and which way after the turn?",
  hint:"Move, turn right, move, turn left. Do that twice, then move once more.",
  code:"Count how many blocks you used. Once you learn loops, you can walk paths like this with far fewer."},
 {ch:"Loops",name:"Long Hallway",concept:"Loops",goal:"Walk to the end of a 7-step hallway",challenge:"Challenge: use only 2 blocks",
  explain:"When you need to do the same thing many times, wrap it in a “repeat” block instead of copying it over and over. That's a loop.",
  hint:"Add “repeat”, tap the dashed box inside it, add “move 1 step”, then set the count to 7.",
  code:"JavaScript uses a for loop and Python uses for i in range(7). Both mean “do this 7 times”."},
 {ch:"Loops",name:"Staircase Path",concept:"Loops",goal:"Walk down the long staircase and collect 3 gems",challenge:"Challenge: finish in 5 blocks",
  explain:"This is like the Zigzag Trail, only longer. Find the small set of moves that keeps repeating and put it inside a loop.",
  hint:"Repeat 4 times: move, turn right, move, turn left.",
  code:"A loop can hold several blocks. They repeat together, in order."},
 {ch:"Build & Dig",name:"Build a Bridge",concept:"Building",goal:"Lay a path across the water to the far bank",challenge:"Challenge: finish in 5 blocks",
  explain:"Bitwick can't swim. “place block ahead” lays a plank on the water in front of Bitwick so it can walk across.",
  hint:"Move 1 step, then repeat 4 times “place block, move”, then move 1 more step.",
  code:"robot.place(FORWARD) places a block in front of the robot. You can also use a “combo” block to join “place” and “move” into one block, then put it inside a repeat."},
 {ch:"Build & Dig",name:"Lava River",concept:"Building",goal:"Bridge two stretches of lava to reach the gem",challenge:"Challenge: finish in 5 blocks",
  explain:"You can place blocks on lava too. Careful: placing a block on grass makes a stone that blocks the way.",
  hint:"Repeat 2 times: place block, move, move, turn right.",
  code:"The same code works in different places, as long as each situation looks the same."},
 {ch:"Build & Dig",name:"Clear the Path",concept:"Digging",goal:"Dig away the trees blocking the path",challenge:"Challenge: finish in 4 blocks",
  explain:"Trees block the way. “dig block ahead” removes the block in front of Bitwick and collects it. Digging empty ground does nothing.",
  hint:"Spot the pattern: move, dig, move. Put those three inside “repeat 3 times”.",
  code:"robot.dig(FORWARD) digs ahead. Finding a pattern and turning it into a loop is one of the most useful coding habits."},
 {ch:"Build & Dig",name:"Stone Mine",concept:"Digging",goal:"Tunnel through the stone to the hidden gem",challenge:"Challenge: finish in 7 blocks (experts: try 5)",
  explain:"Bitwick is surrounded by stone and has to dig before every step. Dig 3 blocks east, then 3 blocks south.",
  hint:"Repeat 3 times “dig, move”, turn right, then repeat 3 times “dig, move” again.",

function saveCust(){try{localStorage.setItem("block-miner-custom-cur",JSON.stringify(CUST))}catch(e){}}
function saveMine(){try{localStorage.setItem("block-miner-custom-list",JSON.stringify(MYLEVELS))}catch(e){}}
function applyCust(){
  const L=LEVELS[CUSTOM_LV];
  L.map=CUST.grid.map(r=>r.join(""));L.dir=CUST.dir;L.optimal=CUST.optimal||0;
  L.palette=["forward",...CUST.blocks.filter(k=>k!=="forward")].flatMap(k=>ED_BLOCKS[k]||[]);
  L.vars=CUST.blocks.includes("vars");
  saveCust();
}
function custCheck(){let r=0,g=0;CUST.grid.forEach(row=>row.forEach(c=>{if(c==="R")r++;if(c==="G")g++}));return{r,g,ok:r===1&&g>0}}
const ED={tool:"T",painting:false,pendingDel:null,panel:null,reload:false};
function edReload(){if(ED.reload)return;ED.reload=true;requestAnimationFrame(()=>{ED.reload=false;applyCust();loadWorld();edCheckMsg()})}
function edCheckMsg(){const c=custCheck(),el=$("edCheck");if(!el)return;el.textContent=c.ok?t("ed_ok"):(c.r!==1?t("ed_needStart"):"")+(c.g?"":" "+t("ed_needGem"));el.className="ed-check "+(c.ok?"good":"bad")}
function cellHTML(c,x,y){const glyph=c==="G"?"◆":c==="R"?ARROWS[CUST.dir]:c==="T"?"♣":"";
  return `<button class="ed-cell t-${c==="."?"g":c}" data-cx="${x}" data-cy="${y}" aria-label="${x+1},${y+1} ${t(c==="."?"tl_grass":"tl_"+c)}">${glyph}</button>`}

   <div class="ed-tools" role="radiogroup" aria-label="${t("ed_tiles")}">${ED_TILES.map(k=>`<button class="ed-tool${ED.tool===k?" on":""}" role="radio" aria-checked="${ED.tool===k}" data-tool="${k}"><span class="sw t-${k==="."?"g":k}">${k==="G"?"◆":k==="R"?"▶":k==="T"?"♣":""}</span>${t(k==="."?"tl_grass":"tl_"+k)}</button>`).join("")}</div>
   <div class="ed-grid" id="edGrid" style="--n:${n}">${CUST.grid.map((row,y)=>row.map((c,x)=>cellHTML(c,x,y)).join("")).join("")}</div>

   <div class="ed-row"><label for="edTarget">${t("ed_target")}</label><input id="edTarget" class="ed-input num" type="number" min="0" max="99" value="${CUST.optimal||0}"></div>

   <div class="ed-row"><label for="edMine">${t("ed_mine")}</label>${MYLEVELS.length?`<select id="edMine" class="ed-input">${mine}</select>
     <button class="btn" data-ed="load">${t("ed_load")}</button><button class="btn${ED.pendingDel!=null?" danger":""}" data-ed="delete">${ED.pendingDel!=null?t("ed_confirmDel"):t("ed_delete")}</button>`:`<span class="ed-tip">${t("ed_none")}</span>`}</div>

   ${ED.panel==="import"?`<div class="ed-share"><label for="edCode" class="ed-tip">${t("ed_pasteHint")}</label><textarea id="edCode" rows="3"></textarea><button class="btn primary" data-ed="apply">${t("ed_apply")}</button></div>`:""}`;

  if(ED.mineSel!=null&&$("edMine"))$("edMine").value=ED.mineSel;

function esc(x){return String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function exportCode(){
  const o={n:CUST.name,m:CUST.grid.map(r=>r.join("")),d:CUST.dir,b:CUST.blocks,o:CUST.optimal||0};
  return "QBM1."+btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=+$/,"");
}
function importCode(str){
  try{
    const m=String(str).trim().match(/QBM1\.([A-Za-z0-9+/]+)/);if(!m)return null;
    let b=m[1];while(b.length%4)b+="=";
    const o=JSON.parse(decodeURIComponent(escape(atob(b))));
    const c={name:String(o.n||"").slice(0,30)||tr("ed_newName"),grid:(o.m||[]).map(r=>String(r).split("")),dir:+o.d||0,
      blocks:(o.b||[]).filter(k=>ED_BLOCKS[k]),optimal:Math.max(0,Math.min(99,+o.o||0))};
    return validCust(c)?c:null;
  }catch(e){return null}
}
function paintCell(x,y,first){
  const g=CUST.grid,cur=g[y][x],tool=ED.tool;
  if(tool==="R"){
    if(!first)return;
    if(cur==="R"){CUST.dir=(CUST.dir+1)%4}
    else{g.forEach(row=>row.forEach((c,i)=>{if(c==="R")row[i]="."}));g[y][x]="R"}
    const grid=$("edGrid");grid.innerHTML=g.map((row,yy)=>row.map((c,xx)=>cellHTML(c,xx,yy)).join("")).join("");
  }else{
    if(cur===tool)return;
    g[y][x]=tool;
    const el=document.querySelector(`.ed-cell[data-cx="${x}"][data-cy="${y}"]`);if(el)el.outerHTML=cellHTML(tool,x,y);
  }
  edReload();
}
function edResize(n){
  const old=CUST.grid,g=Array.from({length:n},(_,y)=>Array.from({length:n},(_,x)=>old[y]&&old[y][x]?old[y][x]:"."));
  CUST.grid=g;applyCust();renderEditor();loadWorld();
}
function setCust(c,msg){CUST=c;ED.panel=null;ED.pendingDel=null;applyCust();S.progs[CUSTOM_LV]=S.progs[CUSTOM_LV]||[];renderEditor();renderPalette();renderProgram();loadWorld();$("result").hidden=true;if(msg)status(msg,"good")}
function edAction(a){
  if(a==="save"){const i=MYLEVELS.findIndex(m=>m.name===CUST.name);const copy=JSON.parse(JSON.stringify(CUST));if(i>=0)MYLEVELS[i]=copy;else MYLEVELS.push(copy);saveMine();ED.mineSel=i>=0?i:MYLEVELS.length-1;renderEditor();status(tr("ed_saved",CUST.name),"good")}
  else if(a==="new"){const n=7;const g=Array.from({length:n},()=>Array.from({length:n},()=>"."));g[3][1]="R";setCust({name:tr("ed_newName"),grid:g,dir:1,blocks:CUST.blocks.slice(),optimal:0},"")}
  else if(a==="export"||a==="import"){ED.panel=ED.panel===a?null:a;renderEditor();if(a==="import"&&$("edCode"))$("edCode").focus()}
  else if(a==="copy"){const ta=$("edCode");const done=()=>{const b=document.querySelector('[data-ed="copy"]');if(b)b.textContent=tr("ed_copied")};
    try{navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();done()})}catch(e){ta.select();done()}}
  else if(a==="apply"){const c=importCode($("edCode").value);if(!c){status(tr("ed_badCode"),"bad");return}setCust(c,tr("ed_loaded",c.name))}
  else if(a==="load"){const i=+$("edMine").value;ED.mineSel=i;if(MYLEVELS[i])setCust(JSON.parse(JSON.stringify(MYLEVELS[i])),tr("ed_loaded",MYLEVELS[i].name))}
  else if(a==="delete"){const i=+$("edMine").value;if(ED.pendingDel!==i){ED.pendingDel=i;ED.mineSel=i;renderEditor();return}
    const nm=MYLEVELS[i].name;MYLEVELS.splice(i,1);saveMine();ED.pendingDel=null;ED.mineSel=null;renderEditor();status(tr("ed_deleted",nm),"good")}
}

/* ---------- world ---------- */
const DX=[0,1,0,-1],DY=[-1,0,1,0];
function loadWorld(){
  const L=LEVELS[S.lv];
  W=(L.adv&&ADV.mode==="explore")?makeAdvWorld():makeWorld(L);if(L.bp)W.target=getTarget(L);
  hud();if(R3)buildScene();
}
function getTarget(L){
  if(L._target)return L._target;
  const keep=W;W=makeWorld(L);W.sim=true;
  try{const g=exec(fromSpec(L.solution));while(!g.next().done);}catch(e){console.error("blueprint",e)}
  L._target=new Map(W.vox);W=keep;return L._target;
}
function checkTarget(){
  let missing=0,extra=0;
  W.target.forEach((m,k)=>{if(W.vox.get(k)!==m)missing++});
  W.vox.forEach((m,k)=>{if(!W.target.has(k))extra++});
  return{ok:!missing&&!extra,missing,extra};
}
function makeWorld(L){
  const grid=L.map.map(r=>r.split(""));
  const gems=new Set();let rx=0,ry=0;
  grid.forEach((row,y)=>row.forEach((c,x)=>{
    if(c==="G"){gems.add(x+","+y);row[x]="."}
    if(c==="R"){rx=x;ry=y;row[x]="."}
  }));
  if(L.home&&grid[L.home[1]])grid[L.home[1]][L.home[0]]="H";
  return {grid,orig:grid.map(r=>r.slice()),inv:L.inv==null?null:L.inv,gems,total:gems.size,got:0,steps:0,wood:0,vars:{steps:0,count:0},build:!!L.build,vox:new Map(),maxH:0,
     r:{x:rx,y:ry,dir:L.dir,h:0},disp:{x:rx,y:ry,a:L.dir*90,h:0},ta:L.dir*90,fail:false,shake:0,sparks:[]};
}
function tileAt(x,y){return (W.grid[y]&&W.grid[y][x])||"#"}
function front(){return{x:W.r.x+DX[W.r.dir],y:W.r.y+DY[W.r.dir]}}
function walkable(c){return ".BICPOHpnrsmq".includes(c)&&c!==""}
function failWith(msg){W.fail=true;W.shake=1;throw{msg}}

function traces(){if(!W.orig)return 0;let n=0;W.grid.forEach((row,y)=>row.forEach((c,x)=>{if(c==="B"||(c==="S"&&W.orig[y][x]!=="S"))n++}));return n}
function atHome(){const L=LEVELS[S.lv];return !L.home||(W.r.x===L.home[0]&&W.r.y===L.home[1])}
const won=()=>{if(W.adv||W.build||W.got!==W.total)return false;const L=LEVELS[S.lv];if(L.cleanup&&traces())return false;return atHome()};
const vkey=(x,h,z)=>x+","+h+","+z;
function voxSet(k,mat){
  if(mat)W.vox.set(k,mat);else W.vox.delete(k);
  if(mat)W.maxH=Math.max(W.maxH,+k.split(",")[1]+1);
  if(!R3||W.sim)return;
  const gh=R3.ghostMeshes.get(k);if(gh)gh.visible=W.vox.get(k)!==W.target.get(k);
  const old=R3.voxMeshes.get(k);if(old){R3.voxels.remove(old);R3.voxMeshes.delete(k)}
  if(mat){const[x,h,z]=k.split(",").map(Number);const m=add(R3.voxels,R3.G.box,R3.M.mats[mat],x,h+.5,z,mat!=="glass");R3.voxMeshes.set(k,m)}
}
function actBuild(type,b){
  W.steps++;if(W.steps>6000)throw{msg:t("tooMany")};
  const n=W.grid.length,inB=(x,z)=>x>=0&&z>=0&&x<n&&z<n,f=front(),h=W.r.h,x=W.r.x,z=W.r.y;
  if(type==="forward"){
    if(!inB(f.x,f.y))failWith(t("edge"));
    if(W.vox.has(vkey(f.x,h,f.y)))failWith(t("blocked",t("tile_block")));
    W.r.x=f.x;W.r.y=f.y;
  }else if(type==="left"){W.r.dir=(W.r.dir+3)%4;W.ta-=90}
  else if(type==="right"){W.r.dir=(W.r.dir+1)%4;W.ta+=90}
  else if(type==="up"){if(h>=12)failWith(t("tooHigh"));if(W.vox.has(vkey(x,h+1,z)))failWith(t("blockedUp"));W.r.h++}
  else if(type==="down"){if(h===0)failWith(t("onGround"));if(W.vox.has(vkey(x,h-1,z)))failWith(t("blockedDown"));W.r.h--}
  else if(type==="build"||type==="digAt"){
    let k;
    if(b.dir==="down"){if(h===0)failWith(t("noRoomBelow"));k=vkey(x,h-1,z)}
    else{if(!inB(f.x,f.y))failWith(t("edge"));k=vkey(f.x,h,f.y)}
    voxSet(k,type==="build"?b.mat:null);if(!W.sim)sfx(type==="build"?"place":"dig");
  }
  hud();
}
function stepTo(f,c){
  const ox=W.r.x,oy=W.r.y,fromThin=tileAt(ox,oy)==="C";
  if(c==="W"){W.r.x=f.x;W.r.y=f.y;if(fromThin)crack(ox,oy);fx("splash",f.x,f.y);failWith(t("splash"))}
  if(c==="L"){W.r.x=f.x;W.r.y=f.y;if(fromThin)crack(ox,oy);fx("ember",f.x,f.y);failWith(t("lava"))}
  if(!walkable(c))failWith(t("blocked",t("tile_"+(TILE_NAME[c]||c==="D"?c:"wall"))));
  W.r.x=f.x;W.r.y=f.y;
  if(fromThin)crack(ox,oy);
  const k=f.x+","+f.y;
  if(W.gems.has(k)){W.gems.delete(k);W.got++;burst(f.x,f.y);W.dirty=true}
  if(c==="P"){W.grid.forEach(row=>row.forEach((v,i)=>{if(v==="D")row[i]="O";else if(v==="O")row[i]="D"}));W.dirty=true;fx("click",f.x,f.y)}
  else if(c!=="I")fx("dust",f.x,f.y);
}
function crack(x,y){W.grid[y][x]="W";W.dirty=true;fx("ice",x,y)}
function act(type,b){
  if(W.build)return actBuild(type,b);
  W.steps++; if(W.steps>600) throw{msg:t("tooMany")};
  const f=front(),c=tileAt(f.x,f.y);
  if(type==="forward"){
    stepTo(f,c);
    let g=0;
    while(tileAt(W.r.x,W.r.y)==="I"&&g++<40){const n=front(),nc=tileAt(n.x,n.y);if(nc!=="W"&&nc!=="L"&&!walkable(nc))break;stepTo(n,nc)}
  }else if(type==="left"){W.r.dir=(W.r.dir+3)%4;W.ta-=90;if(!W.sim)sfx("turn")}
  else if(type==="right"){W.r.dir=(W.r.dir+1)%4;W.ta+=90;if(!W.sim)sfx("turn")}
  else if(type==="place"){if(!W.sim)sfx("place");
    const ok=c==="W"||c==="L"||(c==="."&&!W.gems.has(f.x+","+f.y));
    if(ok&&W.inv!=null){if(W.inv<=0)failWith(t("noBlocks"));W.inv--}
    if(c==="W"||c==="L"){W.grid[f.y][f.x]="B";W.dirty=true}
    else if(ok){W.grid[f.y][f.x]="S";W.dirty=true}
  }else if(type==="dig"){
    if(c==="T"){W.grid[f.y][f.x]=".";W.wood++;W.dirty=true;fx("leaf",f.x,f.y)}
    else if(c==="S"){W.grid[f.y][f.x]=".";if(W.inv!=null)W.inv++;W.dirty=true;fx("stone",f.x,f.y)}
    else if(c==="B"){const o=W.orig[f.y][f.x];W.grid[f.y][f.x]=(o==="L"?"L":"W");if(W.inv!=null)W.inv++;W.dirty=true;fx("dust",f.x,f.y)}
  }
  hud();
}
function check(cond){
  if(cond==="done")return W.got===W.total;
  const f=front(),c=tileAt(f.x,f.y);
  if(cond==="tree") return c==="T";
  if(cond==="water") return c==="W";
  return !walkable(c);
}
function val(x){return typeof x==="string"?W.vars[x]:x}
let FDEPTH=0;
function* exec(list){
  for(const b of list){
    if(won()) return;
    if(b.type==="func")continue;
    if(b.type==="until"){let n=0;yield {id:b.id,silent:true};
      while(!check(b.cond)){if(++n>200)throw{msg:t("untilTooMany")};yield* exec(b.body);if(won())return;yield {id:b.id,silent:true}}continue}
    if(b.type==="combo"){act(b.a,b);yield {id:b.id};if(won())return;act(b.b,b);yield {id:b.id};continue}
    if(b.type==="ifElse"){const ok=check(b.cond);yield {id:b.id};yield* exec(ok?b.body:b.elseBody);continue}
    if(b.type==="call"){const f=prog().find(x=>x.type==="func"&&x.name===b.name);if(!f)throw{msg:t("noFunc",b.name)};
      if(++FDEPTH>20){FDEPTH=0;throw{msg:t("tooDeep")}}yield {id:b.id};try{yield* exec(f.body)}finally{FDEPTH--}continue}
    if(b.type==="repeat"){const n=val(b.n);if(n>60)throw{msg:t("repeatTooMany",n)};for(let i=0;i<n;i++){yield {id:b.id,silent:true};yield* exec(b.body);if(won())return}}
    else if(b.type==="setVar"){W.vars[b.v]=b.n;hud();yield {id:b.id}}
    else if(b.type==="changeVar"){W.vars[b.v]+=b.n;hud();yield {id:b.id}}
    else if(b.type==="forwardV"){const n=W.vars[b.v];
      if(n<0)throw{msg:t("negative",vn(b.v),n)};
      if(n===0){yield {id:b.id}}
      for(let i=0;i<n;i++){act("forward");yield {id:b.id};if(won())return}}
    else if(b.type==="if"){const ok=check(b.cond);yield {id:b.id};if(ok) yield* exec(b.body)}
    else {act(b.type,b);yield {id:b.id}}
  }
}

function mustMiss(must,list){const all=[];const walk=l=>l.forEach(b=>{all.push(b);if(b.body)walk(b.body);if(b.elseBody)walk(b.elseBody)});walk(list);
  return must.filter(k=>k==="fnB"?!(all.some(b=>b.type==="func"&&b.name==="B")&&all.some(b=>b.type==="call"&&b.name==="B")):k==="repVar"?!all.some(b=>b.type==="repeat"&&typeof b.n==="string"):k==="count"?!all.some(b=>b.v==="count"||b.n==="count"):!all.some(b=>b.type===k))}
function run(){
  if(S.running){stop(t("stopped"));return}
  if(LEVELS[S.lv].custom&&!custCheck().ok){status(t("ed_invalid"),"bad");return}
  if(!prog().length){status(t("addFirst"),"bad");return}
  {const L=LEVELS[S.lv],P=L.adv&&ADV.mode==="puzzle"?PUZ[ADV.pz]:null;
   if(P&&P.must){const miss=mustMiss(P.must,prog());if(miss.length){status(tr("adv_must",miss.map(k=>tr("mu_"+k)).join("、")),"bad");return}}
   if(P&&P.maxBlocks&&count(prog())>P.maxBlocks){status(tr("adv_maxBlocks",P.maxBlocks,count(prog())),"bad");return}
   if(P&&P.maps){if(!pzCont){pzMap=0;L.map=P.maps[0]}pzCont=false}}
  loadWorld();$("result").hidden=true;
  S.running=true;FDEPTH=0;gen=exec(prog());setRunUI();status(t("running"));
  {const r=$("canvasBox").getBoundingClientRect();if(!$("canvasBox").classList.contains("full")&&(r.top<0||r.bottom>innerHeight))$("canvasBox").scrollIntoView({behavior:reduce?"auto":"smooth",block:r.height>innerHeight?"start":"center"})}
  tick();
}
function tick(){
  let r;
  try{r=gen.next()}catch(e){highlight(curId);return end(false,e.msg||t("error"))}
  if(r.done){
    highlight(null);
    if(LEVELS[S.lv].free||won()) return end(true);
    if(W.target){const c=checkTarget();return c.ok?end(true):end(false,t("bpMissing",c.missing,c.extra))}
    const left=W.total-W.got;
    if(left)return end(false,t("leftGems",left));
    const tr_=traces();if(LEVELS[S.lv].cleanup&&tr_)return end(false,t("traces",tr_));
    return end(false,t("notHome"));
  }
  curId=r.value.id;highlight(curId);
  if(won()){timer=setTimeout(()=>end(true),[420,200,120,60][S.speed]);return}
  const delay=r.value.silent?[140,60,0,0][S.speed]:[420,190,22,0][S.speed];
  timer=setTimeout(tick,delay);
}
function stop(msg){clearTimeout(timer);S.running=false;gen=null;highlight(null);setRunUI();if(msg)status(msg)}
function end(win,msg){
  clearTimeout(timer);S.running=false;gen=null;setRunUI();
  if(!win){status(msg,"bad");sfx("fail");return}
  sfx("win");
  highlight(null);
  if(LEVELS[S.lv].free){status(t("buildDone",W.vox.size),"good");return}
  if(LEVELS[S.lv].adv){advPuzzleWin();return}
  const L=LEVELS[S.lv],n=count(prog());
  if(L.custom){
    const o=L.optimal,sc=o?(n<=o?3:n<=o+3?2:1):0;

    $("result").innerHTML=`<div class="result-card" role="dialog" aria-label="${t("passAria")}">
      ${sc?`<div class="stars" aria-label="${t("starsAria",sc)}">${"★".repeat(sc)}<span class="off">${"★".repeat(3-sc)}</span></div>`:""}
      <h3>${t("ed_win")}</h3><p>${sc?(sc===3?t("best"):t("tryBest",o)):t("ed_winTip")}</p>
      <div class="row"><button class="btn" id="again">${t("again")}</button></div></div>`;
    $("result").hidden=false;$("again").onclick=()=>{loadWorld();$("result").hidden=true;status("")};return;
  }
  const help=hintedLv(S.lv)&&!medalLv(S.lv);
  const stars=help?0:n<=L.optimal?3:n<=L.optimal+3?2:1;
  if(help)progress["c"+S.lv]=1;else{progress[S.lv]=Math.max(progress[S.lv]||0,stars);progress["m"+S.lv]=1}
  save();renderLevels();
  status(t("done",n),"good");confetti();
  const last=S.lv>=FIRST_SP-1;

  const tip=help?t("rw_help"):(stars===3?t("best"):t("tryBest",L.optimal));
  $("result").innerHTML=`<div class="result-card" role="dialog" aria-label="${t("passAria")}">
    ${help?`<div class="stars"><span class="off">★★★</span></div>`:`<div class="stars" aria-label="${t("starsAria",stars)}">${st}</div><p class="medal">🏅 ${t("rw_medal")}</p>`}
    <h3>${last?t("allDone"):t("passed")}</h3><p>${tip}</p>
    <div class="row"><button class="btn" id="again">${t("again")}</button>${S.lv<FIRST_SP-1?`<button class="btn primary" id="next">${t("next")}</button>`:""}</div></div>`;
  $("result").hidden=false;

/* ---------- code generation ---------- */
const sp=(c,t)=>`<span class="t-${c}">${t}</span>`;
const VARS=["i","j","k","m"];
function call(fn,arg){return `robot.${sp("fn",fn)}(${arg?sp("const",arg):""})`}
function stmt(b,lang){
  if(b.type==="forward")return call("forward");
  if(b.type==="left")return call("turn","LEFT");
  if(b.type==="right")return call("turn","RIGHT");
  if(b.type==="place")return call("place","FORWARD");
  if(b.type==="dig")return call("dig","FORWARD");
  if(b.type==="forwardV")return `robot.${sp("fn","forward")}(${b.v})`;
  if(b.type==="setVar")return `${b.v} = ${sp("num",b.n)}`;
  if(b.type==="changeVar")return `${b.v} ${b.n<0?"-=":"+="} ${sp("num",Math.abs(b.n))}`;
  if(b.type==="up")return call("up");
  if(b.type==="down")return call("down");
  if(b.type==="build")return `robot.${sp("fn","place")}(${sp("const",b.dir==="down"?"DOWN":"FORWARD")}, ${sp("const",MATCODE[b.mat])})`;
  if(b.type==="digAt")return call("dig",b.dir==="down"?"DOWN":"FORWARD");
  if(b.type==="call")return `${sp("fn",fnName(b.name,lang))}()`;
  if(b.type==="combo")return `${stmt({type:b.a},lang)}; ${stmt({type:b.b},lang)}`;
}
const fnName=(n,lang)=>lang==="py"?"action_"+n.toLowerCase():"action"+n;
function untilExpr(c,lang){
  if(c==="done")return lang==="py"?`robot.${sp("fn","gems_left")}() > ${sp("num",0)}`:`robot.${sp("fn","gemsLeft")}() > ${sp("num",0)}`;
  if(c==="blocked")return lang==="py"?`${sp("kw","not")} ${call("blocked","FORWARD")}`:`!${call("blocked","FORWARD")}`;
  return `${call("inspect","FORWARD")} != ${sp("const",c==="tree"?"TREE":"WATER")}`;
}
function usedVars(list,set=new Set()){for(const b of list){if(b.v)set.add(b.v);if(b.type==="repeat"&&typeof b.n==="string")set.add(b.n);kids(b).forEach(k=>usedVars(k,set))}return set}
let DECL=new Set();
const numOrVar=n=>typeof n==="string"?n:sp("num",n);
function condExpr(c){
  if(c==="blocked")return call("blocked","FORWARD");
  return `${call("inspect","FORWARD")} == ${sp("const",c==="tree"?"TREE":"WATER")}`;
}
function emit(list,lang,ind,depth,out){
  const pad="    ".repeat(ind);
  for(const b of list){
    if(b.type==="repeat"){
      const v=VARS[depth]||("i"+depth);
      if(lang==="js")out.push([b.id,`${pad}${sp("kw","for")} (${sp("kw","let")} ${v} = ${sp("num",0)}; ${v} < ${numOrVar(b.n)}; ${v}++) {`]);
      else out.push([b.id,`${pad}${sp("kw","for")} ${v} ${sp("kw","in")} ${sp("fn","range")}(${numOrVar(b.n)}):`]);
      emit(b.body,lang,ind+1,depth+1,out);
      if(lang==="py"&&!b.body.length)out.push([null,`${pad}    ${sp("kw","pass")}`]);
      if(lang==="js")out.push([null,`${pad}}`]);
    }else if(b.type==="func"){
      if(lang==="js")out.push([b.id,`${pad}${sp("kw","function")} ${sp("fn",fnName(b.name,lang))}() {`]);
      else{out.push([b.id,`${pad}${sp("kw","def")} ${sp("fn",fnName(b.name,lang))}():`]);
        const g=[...usedVars(b.body)].filter(v=>JSON.stringify(toSpec(b.body)).match(new RegExp('"type":"(setVar|changeVar)","v":"'+v+'"')));
        if(g.length)out.push([null,`${pad}    ${sp("kw","global")} ${g.join(", ")}`])}
      emit(b.body,lang,ind+1,0,out);
      if(lang==="py"&&!b.body.length)out.push([null,`${pad}    ${sp("kw","pass")}`]);
      if(lang==="js")out.push([null,`${pad}}`]);
      out.push([null,""]);
    }else if(b.type==="until"){
      if(lang==="js")out.push([b.id,`${pad}${sp("kw","while")} (${untilExpr(b.cond,lang)}) {`]);
      else out.push([b.id,`${pad}${sp("kw","while")} ${untilExpr(b.cond,lang)}:`]);
      emit(b.body,lang,ind+1,depth,out);
      if(lang==="py"&&!b.body.length)out.push([null,`${pad}    ${sp("kw","pass")}`]);
      if(lang==="js")out.push([null,`${pad}}`]);

 t2:{name:AX("冰門石碑","Ice Gate Stone"),req:["compass"],region:"temple",dir:1,

function solFor(){
  const L=LEVELS[S.lv];
  if(L.adv){if(ADV.mode!=="puzzle"||!PUZ[ADV.pz])return null;const pal=L.palette||[];
    const s=PUZ[ADV.pz].sols.find(o=>(o.need||[]).every(k=>pal.includes(k)))||PUZ[ADV.pz].sols.at(-1);return{spec:s.spec,notes:s.notes}}
  if(!L.solution||L.free||L.custom)return null;return{spec:L.solution,notes:SOLNOTE[S.lv]||[]};
}
const CIRC="①②③④⑤⑥⑦⑧⑨⑩";
function solLabel(b){return blockInner(b.type,Object.assign({},b,{id:"sol"})).replace(/<select[\s\S]*?<\/select>/g,m=>{const o=m.match(/<option[^>]*selected[^>]*>([^<]*)<\/option>/);return `<b>${o?o[1]:""}</b>`})}
function teachBody(te){return `<p>${tx(te.text)}</p>${te.ex?`<p class="sol-warn">${tr("adv_example")}</p><div class="sol-list">${solRows(te.ex,[])}</div>`:""}`}
function solRows(spec,notes){
  let k=0;const mark={};notes.forEach((n,i)=>mark[n[0]]=i);
  const list=l=>l.map(b=>{const idx=k++,cat=BLOCKS[b.type].cat,m=mark[idx]!=null?`<sup class="sol-fn">${CIRC[mark[idx]]}</sup>`:"";
    const head=`<div class="sol-row"><span class="sol-blk c-${cat}">${solLabel(b)}</span>${m}</div>`;
    if(!b.body)return head;
    return head+`<div class="sol-body">${list(b.body)}</div>`+(b.elseBody?`<div class="sol-row"><span class="sol-blk c-${cat}">${t("elseLbl")}</span></div><div class="sol-body">${list(b.elseBody)}</div>`:"")}).join("");
  return list(spec);
}
function solHTML(spec,notes){
  const body=solRows(spec,notes);
  return `<p class="sol-warn">${t("sol_warn")}</p>
    <div class="sol-list">${body}</div>
    ${notes.length?`<ol class="sol-notes">${notes.map((n,i)=>`<li><b>${CIRC[i]}</b> ${LANG==="en"?n[3]:n[2]}</li>`).join("")}</ol>`:""}
    <p class="sol-count">${t("sol_count",countSpec(spec))}</p>
    <div class="ed-row"><button class="btn primary" data-loadsol="1">${t("sol_load")}</button></div>`;
}

    ${(()=>{const nx=PERKS.find(([l])=>l>lv);return `<div class="lesson-btns"><button class="btn" data-perks="1">⭐ ${tr("pk_title")}</button>${perk("warp")?`<button class="btn" data-warpmenu="1">🗺 ${tr("adv_warp")}</button>`:""}</div>`+(nx?`<p class="ed-tip">${tr("pk_next",nx[0],tr("pk_"+nx[1]))}</p>`:"")})()}
    ${perk("radar")&&W&&W.adv?`<p class="ed-tip">📡 ${tr("adv_radar",W.gems.size)}</p>`:""}
    <div class="adv-sec"><p class="pal-title">${tr("adv_quests")}</p><ul class="adv-q">${advQuests().map(([s,d])=>`<li class="${d?"done":""}">${s}</li>`).join("")}</ul></div>
    <div class="adv-sec"><p class="pal-title">${tr("adv_items")}</p><div class="adv-items">${items}</div></div>
    <p class="ed-tip">${tr("adv_controls")}</p>
    <div class="ed-row"><button class="btn${ED.advReset?" danger":""}" data-advreset="1">${ED.advReset?tr("adv_resetSure"):tr("adv_reset")}</button></div>`;
  $("challenge").textContent="";
}
function screenDir(k){
  const az=view.az,fwd=[-Math.sin(az),-Math.cos(az)],rt=[Math.cos(az),-Math.sin(az)];
  const v=k==="up"?fwd:k==="down"?[-fwd[0],-fwd[1]]:k==="right"?rt:[-rt[0],-rt[1]];
  let best=0,bd=-9;for(let d=0;d<4;d++){const dot=DX[d]*v[0]+DY[d]*v[1];if(dot>bd){bd=dot;best=d}}return best;
}
document.addEventListener("keydown",e=>{
  if(!advExplore())return;const tg=e.target;if(tg&&(tg.tagName==="INPUT"||tg.tagName==="TEXTAREA"||tg.tagName==="SELECT"))return;
  const m={ArrowUp:"up",KeyW:"up",ArrowDown:"down",KeyS:"down",ArrowLeft:"left",KeyA:"left",ArrowRight:"right",KeyD:"right"}[e.code];
  if(m){e.preventDefault();advMove(screenDir(m));return}
  if(e.code==="Space"||e.code==="KeyE"||e.code==="Enter"){if(tg&&tg.tagName==="BUTTON"&&e.code!=="KeyE")return;e.preventDefault();advInteract()}
});
let padTimer=null;
document.addEventListener("pointerdown",e=>{const b=e.target.closest("[data-pad]");if(!b)return;e.preventDefault();const k=b.dataset.pad;
  if(k==="act"){advInteract();return}advMove(screenDir(k));clearInterval(padTimer);padTimer=setInterval(()=>advMove(screenDir(k)),walkDelay()+30)});
["pointerup","pointercancel","pointerleave"].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.closest&&e.target.closest("[data-pad]")||ev!=="pointerleave")clearInterval(padTimer)}));

applyStatic();setRunUI();
$("langBtn").onclick=()=>{LANG=LANG==="en"?"zh":"en";try{localStorage.setItem("block-miner-lang",LANG)}catch(e){}
  stop();applyStatic();setRunUI();renderLevels();renderLesson();renderPalette();renderProgram();hud();status("")};
let startLv=0;try{const v=+localStorage.getItem(KEY+"-lv");if(v>=0&&v<LEVELS.length)startLv=v}catch(e){}
goLevel(startLv);
buildScene();
window.blockMiner={SOLNOTE,closeModal,countSpec,audio:{AUD,compose,tone,hit,THEMES},get adv(){return ADV},advMove,advInteract,openPuzzle,PUZ,AREG,advExitPuzzle,makeAdvWorld,get W(){return W},hostOf,levels:LEVELS,state:S,mk,goLevel,renderProgram,run,examples:EXAMPLES,fromSpec,exportCode,importCode,get cust(){return CUST}};
status(t("example"));
if(startLv!==0)status("");
addEventListener("resize",()=>{if(W)sizeCanvas()});
$("musicBtn").onclick=()=>setMusic(!AUD.music);$("sfxBtn").onclick=()=>setSound(!AUD.sound);
document.addEventListener("pointerdown",function first(){document.removeEventListener("pointerdown",first,true);if(AUD.music)setMusic(true);if(AUD.sound&&audInit())AUD.ctx.resume()},true);
audUI();
$("rotL").onclick=()=>rotateView(1);$("rotR").onclick=()=>rotateView(-1);
function setFull(on){const box=$("canvasBox");if(box.classList.contains("full")===on)return;box.classList.toggle("full",on);
  $("fullBtn").textContent=on?"✕":"⛶";$("fullBtn").setAttribute("aria-label",t(on?"fullOff":"fullOn"));
  try{if(on&&box.requestFullscreen&&!document.fullscreenElement)box.requestFullscreen().catch(()=>{});else if(!on&&document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(e){}
  setRunUI();sizeCanvas();setTimeout(sizeCanvas,250)}
$("fullBtn").onclick=()=>setFull(!$("canvasBox").classList.contains("full"));
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement)setFull(false)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("modal").hidden){closeModal();return}setFull(false)}});
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal()});
$("fsRun").onclick=run;
$("zoomIn").onclick=()=>{view.tzoom=Math.max(.45,view.tzoom*.82)};$("zoomOut").onclick=()=>{view.tzoom=Math.min(1.8,view.tzoom/.82)};
requestAnimationFrame(frame);
})();
