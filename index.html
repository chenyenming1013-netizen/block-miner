<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="用積木學寫程式：帶機器人小方在 3D 方塊世界挖寶石，並對照 JavaScript 與 Python 程式碼。">
<title>方塊礦工程式課</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700;900&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: lesson + pixel world on the left, block bench + live code on the right; stacks on phones */
:root{
  --bg:#E7EEE4; --surface:#F6FAF4; --surface-2:#EDF3EA; --ink:#17231B; --muted:#56675B; --line:#C8D5C3;
  --accent:#2B7A4A; --accent-ink:#FFFFFF; --warn:#B4441E; --ok:#2B7A4A; --gold:#D9A21F;
  --frame:#1E2721; --frame-line:#34413A;
  --code-bg:#18211C; --code-fg:#DCE6DE; --code-dim:#6E8275; --c-kw:#E59BD8; --c-fn:#8CC8FF; --c-num:#F6C177; --c-const:#7FE0B5; --c-var:#DCE6DE;
  --dot:#C9D6C5;
  --b-move:#2F6FD6; --b-turn:#6A55C9; --b-loop:#1E8F54; --b-build:#C26A1A; --b-logic:#0F7E86;
  --f-display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-pixel:"Silkscreen","Courier New",monospace;
  --f-code:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101612; --surface:#18201B; --surface-2:#1E2822; --ink:#E2EBE0; --muted:#97A99B; --line:#2D3B32;
  --accent:#55B97D; --accent-ink:#0D1A12; --warn:#F08A5D; --ok:#55B97D; --gold:#F0C04A;
  --frame:#0B100D; --frame-line:#26322B; --dot:#26332B; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#101612; --surface:#18201B; --surface-2:#1E2822; --ink:#E2EBE0; --muted:#97A99B; --line:#2D3B32;
  --accent:#55B97D; --accent-ink:#0D1A12; --warn:#F08A5D; --ok:#55B97D; --gold:#F0C04A;
  --frame:#0B100D; --frame-line:#26322B; --dot:#26332B; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:16px 40px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px}
.brand{display:flex;align-items:center;gap:12px}
.brand canvas{width:40px;height:40px;image-rendering:pixelated}
.brand h1{font-family:var(--f-display);font-weight:900;font-size:1.45rem;margin:0;line-height:1.2;letter-spacing:.02em}
.brand p{margin:0;color:var(--muted);font-size:.85rem}
.levels{display:flex;flex-wrap:wrap;gap:6px}
.lv{width:46px;height:50px;border:2px solid var(--line);background:var(--surface);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.lv b{font-family:var(--f-pixel);font-size:1.05rem;line-height:1}
.lv i{font-style:normal;font-size:.62rem;letter-spacing:-1px;color:var(--gold);min-height:.9em;line-height:1}
.lv.cur{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
@media (max-width:440px){.levels{gap:4px}.lv{width:calc((100vw - 32px - 24px)/7);height:44px}}
.lv.cur i{color:var(--accent-ink)}

.layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:920px){.layout{grid-template-columns:minmax(0,1fr)}}

/* lesson */
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--f-pixel);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.chip.concept{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-family:var(--f-body);font-weight:700;letter-spacing:.1em}
.lesson h2{font-family:var(--f-display);font-weight:900;font-size:1.6rem;margin:0;line-height:1.25;text-wrap:balance}
.goal{margin:0;font-weight:700}
.goal span{color:var(--accent)}
.explain{margin:0;color:var(--muted);max-width:62ch}
details.hint{border-top:1px dashed var(--line);padding-top:8px}
details.hint summary{cursor:pointer;font-weight:700;color:var(--accent);width:max-content}
details.hint p{margin:6px 0 0;max-width:62ch}

/* world */
.world{background:var(--frame);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--frame-line)}
.canvas-box{position:relative;display:flex;justify-content:center;overflow:hidden}
#world{display:block;max-width:100%;border-radius:4px;touch-action:pan-y;cursor:grab}
#world:active{cursor:grabbing}
.view-ctl{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.view-ctl button{background:rgba(16,24,19,.72);color:#fff;border:0;border-radius:4px;padding:4px 9px;font-size:.8rem;font-weight:700}
.view-ctl button:hover{background:rgba(16,24,19,.9)}
.drag-tip{position:absolute;left:8px;bottom:8px;background:rgba(16,24,19,.6);color:#E9F0EA;font-size:.72rem;padding:2px 8px;border-radius:3px;pointer-events:none}
.hud{display:flex;flex-wrap:wrap;gap:8px 18px;font-family:var(--f-pixel);font-size:.8rem;color:#C7D3CA;letter-spacing:.04em}
.hud b{color:#FFFFFF;font-weight:700}
.status{min-height:1.6em;font-size:.92rem;color:#E9F0EA;font-weight:500}
.status.bad{color:#FF9B73}
.status.good{color:#7FE0A6}

.result{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,16,12,.72);padding:12px}
.result-card{background:var(--surface);color:var(--ink);border-radius:8px;padding:20px 22px;text-align:center;max-width:320px;width:100%;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.result-card h3{margin:0;font-family:var(--f-display);font-weight:900;font-size:1.4rem}
.stars{font-size:2rem;letter-spacing:6px;color:var(--gold);line-height:1}
.stars .off{color:var(--line)}
.result-card p{margin:0;color:var(--muted);font-size:.9rem}
.result-card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* bench */
.bench{background:var(--surface);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.btn{border:2px solid var(--line);background:var(--surface-2);border-radius:6px;padding:6px 14px;font-weight:700;font-size:.9rem}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);padding:6px 20px;font-size:1rem}
.btn.primary.stop{background:var(--warn);border-color:var(--warn);color:#fff}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.toolbar .spacer{flex:1}
.count{font-size:.85rem;color:var(--muted)}
.count b{color:var(--ink);font-variant-numeric:tabular-nums}

.bench-grid{display:grid;grid-template-columns:188px minmax(0,1fr);min-height:340px}
@media (max-width:560px){.bench-grid{grid-template-columns:minmax(0,1fr)}}
.palette{border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2)}
@media (max-width:560px){.palette{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap}}
.pal-title,.prog-title{font-family:var(--f-pixel);font-size:.72rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:0 0 2px}
@media (max-width:560px){.pal-title{width:100%}}
.palette .blk{border:0;text-align:left;width:100%}
@media (max-width:560px){.palette .blk{width:auto}}
.palette .blk:hover{filter:brightness(1.1)}
.palette .blk:disabled{opacity:.35;cursor:not-allowed}

/* blocks */
.blk{position:relative;color:#fff;font-weight:700;font-size:.88rem;border-radius:4px;padding:7px 10px 7px 12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.3;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.blk::after{content:"";position:absolute;left:14px;bottom:-5px;width:16px;height:6px;background:inherit;border-radius:0 0 3px 3px;z-index:1}
.c-move{background:var(--b-move)} .c-turn{background:var(--b-turn)} .c-loop{background:var(--b-loop)} .c-build{background:var(--b-build)} .c-logic{background:var(--b-logic)}
.blk select{background:rgba(255,255,255,.95);color:#17231B;border:0;border-radius:10px;padding:1px 6px;font-weight:700;font-size:.85rem}
.blk .ico{font-family:var(--f-pixel);opacity:.9}

.program-area{padding:12px 14px 18px;background-color:var(--surface);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:18px 18px;min-width:0;display:flex;flex-direction:column;gap:6px}
.prog-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.challenge{font-size:.8rem;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:3px;align-items:flex-start;min-width:0}
.list .item{display:flex;flex-direction:column;min-width:0;max-width:100%}
.start-cap{background:var(--accent);color:var(--accent-ink);font-family:var(--f-pixel);font-size:.75rem;letter-spacing:.08em;padding:6px 14px;border-radius:12px 12px 4px 4px;width:max-content;position:relative}
.start-cap::after{content:"";position:absolute;left:14px;bottom:-5px;width:16px;height:6px;background:inherit;border-radius:0 0 3px 3px}
.tools{display:inline-flex;gap:2px;margin-left:4px}
.tools button{background:rgba(0,0,0,.2);border:0;color:#fff;width:22px;height:22px;border-radius:4px;font-size:.8rem;line-height:1;padding:0}
.tools button:hover{background:rgba(0,0,0,.38)}
.blk.running{outline:3px solid var(--gold);outline-offset:1px}
.wrapper{display:flex;flex-direction:column;min-width:0}
.wrapper > .blk{border-radius:4px 4px 0 0}
.wrapper > .blk::after{display:none}
.mouth{display:flex;min-width:0}
.mouth .arm{width:14px;flex:none}
.mouth .inner{padding:6px 0 6px 6px;display:flex;flex-direction:column;gap:3px;min-width:120px}
.foot{height:14px;width:150px;border-radius:0 0 4px 4px;position:relative}
.foot::after{content:"";position:absolute;left:14px;bottom:-5px;width:16px;height:6px;background:inherit;border-radius:0 0 3px 3px}
.slot{border:2px dashed var(--line);background:transparent;color:var(--muted);border-radius:4px;font-size:.78rem;padding:3px 10px;text-align:left;margin-top:3px;width:max-content;max-width:100%}
.slot.on{border-color:var(--gold);color:var(--ink);background:color-mix(in srgb,var(--gold) 16%,transparent);font-weight:700}
.locked .tools,.locked .slot,.locked select{pointer-events:none}
.empty-tip{color:var(--muted);font-size:.85rem;margin:6px 0 0}

/* code */
.code{border-top:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;gap:0;padding:0 14px;background:var(--surface-2);border-bottom:1px solid var(--line);align-items:stretch}
.tab{border:0;background:none;padding:9px 14px;font-weight:700;font-size:.85rem;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tabs .note{margin-left:auto;align-self:center;font-size:.75rem;color:var(--muted)}
@media (max-width:480px){.tabs .note{display:none}}
pre.src{margin:0;background:var(--code-bg);color:var(--code-fg);font-family:var(--f-code);font-size:.84rem;line-height:1.65;padding:14px 0;overflow-x:auto;border-radius:0 0 8px 8px;min-height:120px;counter-reset:ln}
pre.src .ln{display:block;padding:0 16px 0 0;white-space:pre}
pre.src .ln::before{counter-increment:ln;content:counter(ln);display:inline-block;width:3em;padding-right:1em;text-align:right;color:var(--code-dim)}
pre.src .ln.hot{background:rgba(240,192,74,.16)}
.t-kw{color:var(--c-kw)} .t-fn{color:var(--c-fn)} .t-num{color:var(--c-num)} .t-const{color:var(--c-const)} .t-com{color:var(--code-dim);font-style:italic}

.foot-note{color:var(--muted);font-size:.8rem;text-align:center;margin:4px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <canvas id="logo" width="16" height="16" aria-hidden="true"></canvas>
      <div>
        <h1>方塊礦工程式課</h1>
        <p>拼積木、看程式碼，帶機器人「小方」挖寶石</p>
      </div>
    </div>
    <nav class="levels" id="levels" aria-label="關卡"></nav>
  </header>

  <main class="layout">
    <section class="stage" style="display:flex;flex-direction:column;gap:16px;min-width:0">
      <article class="lesson" id="lesson"></article>
      <div class="world">
        <div class="canvas-box" id="canvasBox">
          <canvas id="world" aria-label="3D 方塊世界地圖"></canvas>
          <div class="view-ctl"><button id="rotL" aria-label="向左旋轉視角">↺</button><button id="rotR" aria-label="向右旋轉視角">↻</button></div>
          <span class="drag-tip">左右拖曳可旋轉視角</span>
          <div class="result" id="result" hidden></div>
        </div>
        <div class="hud">
          <span>寶石 <b id="hGem">0/0</b></span>
          <span>步數 <b id="hStep">0</b></span>
          <span>木頭 <b id="hWood">0</b></span>
        </div>
        <div class="status" id="status" aria-live="polite"></div>
      </div>
    </section>

    <section class="bench" aria-label="程式工作台">
      <div class="toolbar">
        <button class="btn primary" id="runBtn">▶ 執行</button>
        <button class="btn" id="resetBtn">重設地圖</button>
        <button class="btn" id="clearBtn">清空積木</button>
        <button class="btn" id="speedBtn" aria-pressed="false">快轉 ×2</button>
        <span class="spacer"></span>
        <span class="count">積木 <b id="bCount">0</b> 塊</span>
      </div>
      <div class="bench-grid">
        <div class="palette" id="palette"></div>
        <div class="program-area">
          <div class="prog-head">
            <p class="prog-title">我的程式</p>
            <span class="challenge" id="challenge"></span>
          </div>
          <div id="program"></div>
        </div>
      </div>
      <div class="code">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" id="tab-js" aria-selected="true">JavaScript</button>
          <button class="tab" role="tab" id="tab-py" aria-selected="false">Python</button>
          <span class="note">積木會自動翻成程式碼</span>
        </div>
        <pre class="src" id="src"></pre>
      </div>
    </section>
  </main>
  <p class="foot-note">點左側「積木箱」把積木加入程式；虛線框標示新積木會放在哪裡。進度只存在這台裝置的瀏覽器裡。</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
/* ---------- levels ---------- */
const LEVELS=[
 {name:"第一步",concept:"序列",palette:["forward"],dir:1,optimal:3,
  map:["TTTTTTT","T.....T","TR..G.T","T.....T","TTTTTTT"],
  goal:"讓小方走到寶石上",
  explain:"程式是一串照順序執行的指令。小方會從最上面的積木開始，一塊一塊往下做。",
  hint:"寶石在正前方 3 格。放 3 塊「前進 1 格」就到了。",
  code:"每一塊積木都對應一行程式，例如「前進」就是 robot.forward()。"},
 {name:"轉個彎",concept:"方向",palette:["forward","left","right"],dir:1,optimal:7,
  map:["TTTTTTT","TR..TTT","TTT.TTT","TTT..GT","TTTTTTT"],
  goal:"沿著小路轉彎，拿到寶石",
  explain:"轉向只會改變小方面對的方向，不會移動位置。看清楚小方的眼睛朝哪邊，再決定往左或往右。",
  hint:"前進 2、右轉、前進 2、左轉、前進 2。",
  code:"轉向用 robot.turn(LEFT) 或 robot.turn(RIGHT)，括號裡的值叫做「參數」。"},
 {name:"長長的走廊",concept:"迴圈",palette:["forward","left","right","repeat"],dir:1,optimal:2,
  map:["WWWWWWWWWW","TTTTTTTTTT","TR......GT","TTTTTTTTTT","WWWWWWWWWW"],
  goal:"走過 7 格長的走廊",challenge:"挑戰：只用 2 塊積木",
  explain:"同一件事要做很多次時，用「重複」積木把它包起來，就不用一直複製貼上。這就是迴圈。",
  hint:"先加入「重複」，再點它裡面的虛線框，放進「前進」，次數改成 7。",
  code:"JavaScript 用 for 迴圈，Python 用 for i in range(7)，意思都是做 7 次。"},
 {name:"搭一座橋",concept:"建造",palette:["forward","left","right","repeat","place"],dir:1,optimal:5,
  map:["WWWWWWWWW","WR.WWWWGW","WWWWWWWWW"],
  goal:"在水面上鋪路，走到對岸",challenge:"挑戰：5 塊積木內完成",
  explain:"小方不會游泳。「放方塊」會在正前方的水面鋪一塊木板，鋪好才能走過去。",
  hint:"先前進 1 格，然後重複 4 次「放方塊 → 前進」，最後再前進 1 格。",
  code:"robot.place(FORWARD) 會在前方放下方塊。迴圈裡可以放好幾行程式。"},
 {name:"清出小路",concept:"挖掘",palette:["forward","left","right","repeat","place","dig"],dir:1,optimal:4,
  map:["WWWWWWWWW","WR.T.T.GW","WWWWWWWWW"],
  goal:"把擋路的樹挖掉，拿到寶石",challenge:"挑戰：4 塊積木內完成",
  explain:"樹木會擋住去路。「挖掘」會把正前方的方塊挖掉並收集起來；前面是空地時，挖掘不會有任何效果。",
  hint:"找出重複的規律：前進、挖掘、前進。把這三塊放進「重複 3 次」。",
  code:"robot.dig(FORWARD) 挖前方。找出規律再用迴圈，是寫程式最重要的習慣之一。"},
 {name:"看情況做事",concept:"條件",palette:["forward","left","right","repeat","place","dig","if"],dir:1,optimal:6,
  map:["WWWWWWWWWWWW","WR.TW.TWW.GW","WWWWWWWWWWWW"],
  goal:"路上有樹也有水，讓小方自己判斷",challenge:"挑戰：6 塊積木內完成",
  explain:"「如果」積木會先檢查前方是什麼，條件成立才執行裡面的積木。搭配迴圈，小方就能應付不同的路況。",
  hint:"重複 9 次：如果前方是樹木就挖掘、如果前方是水就放方塊、然後前進。",
  code:"if 是條件判斷。== 用來比較兩個值是否相等，和 = 的「指定」意思不同。"},
 {name:"繞場一圈",concept:"巢狀迴圈",palette:["forward","left","right","repeat","place","dig","if"],dir:1,optimal:4,
  map:["TTTTTT","TR.G.T","TGTT.T","T.TTGT","T.G..T","TTTTTT"],
  goal:"沿著外圈走，收集 4 顆寶石",challenge:"挑戰：4 塊積木內完成",
  explain:"迴圈裡面還可以再放迴圈。外層迴圈管「四個邊」，內層迴圈管「每一邊走幾步」。",
  hint:"重複 4 次 { 重複 3 次 { 前進 }、向右轉 }。",
  code:"兩層迴圈要用不同的變數名稱，所以外層用 i、內層用 j。"}
];

const BLOCKS={
  forward:{cat:"move",label:"前進 1 格",ico:"▲"},
  left:{cat:"turn",label:"向左轉",ico:"↺"},
  right:{cat:"turn",label:"向右轉",ico:"↻"},
  place:{cat:"build",label:"在前方放方塊",ico:"■"},
  dig:{cat:"build",label:"挖掉前方方塊",ico:"⛏"},
  repeat:{cat:"loop",label:"重複 _ 次",ico:"⟳"},
  if:{cat:"logic",label:"如果前方是 _",ico:"?"}
};
const CONDS={tree:"樹木",water:"水",blocked:"障礙物"};
const TILE_NAME={T:"樹",S:"石頭",W:"水",L:"岩漿"};

/* ---------- storage ---------- */
const KEY="block-miner-progress-v1";
let progress={};
try{progress=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){progress={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(progress))}catch(e){}}

/* ---------- state ---------- */
let uid=1;
const S={lv:0,progs:LEVELS.map(()=>[]),target:null,running:false,fast:false,tab:"js"};
let W=null; // world
let gen=null,timer=null,curId=null;

function mk(type){const b={id:uid++,type};if(type==="repeat"){b.n=3;b.body=[]}if(type==="if"){b.cond="tree";b.body=[]}return b}
const prog=()=>S.progs[S.lv];
function find(list,id){for(const b of list){if(b.id===id)return b;if(b.body){const r=find(b.body,id);if(r)return r}}return null}
function parentOf(list,id){for(const b of list){if(b.id===id)return list;if(b.body){const r=parentOf(b.body,id);if(r)return r}}return null}
function count(list){return list.reduce((s,b)=>s+1+(b.body?count(b.body):0),0)}

/* ---------- seed level 1 with an example ---------- */
S.progs[0]=[mk("forward")];

/* ---------- world ---------- */
const DX=[0,1,0,-1],DY=[-1,0,1,0];
function loadWorld(){
  const L=LEVELS[S.lv];
  const grid=L.map.map(r=>r.split(""));
  const gems=new Set();let rx=0,ry=0;
  grid.forEach((row,y)=>row.forEach((c,x)=>{
    if(c==="G"){gems.add(x+","+y);row[x]="."}
    if(c==="R"){rx=x;ry=y;row[x]="."}
  }));
  W={grid,gems,total:gems.size,got:0,steps:0,wood:0,
     r:{x:rx,y:ry,dir:L.dir},disp:{x:rx,y:ry,a:L.dir*90},ta:L.dir*90,fail:false,shake:0,sparks:[]};
  hud();if(R3)buildScene();
}
function tileAt(x,y){return (W.grid[y]&&W.grid[y][x])||"#"}
function front(){return{x:W.r.x+DX[W.r.dir],y:W.r.y+DY[W.r.dir]}}
function walkable(c){return c==="."||c==="B"}
function failWith(msg){W.fail=true;W.shake=1;throw{msg}}

function act(type){
  W.steps++; if(W.steps>400) throw{msg:"步數太多了，檢查一下迴圈次數吧"};
  const f=front(),c=tileAt(f.x,f.y);
  if(type==="forward"){
    if(c==="W") {W.r.x=f.x;W.r.y=f.y;failWith("撲通！小方掉進水裡了。試試先放方塊鋪路。")}
    if(c==="L") {W.r.x=f.x;W.r.y=f.y;failWith("小方踩到岩漿了！")}
    if(!walkable(c)) failWith(`前面有${TILE_NAME[c]||"牆"}擋住，小方撞到了。`);
    W.r.x=f.x;W.r.y=f.y;
    const k=f.x+","+f.y;
    if(W.gems.has(k)){W.gems.delete(k);W.got++;burst(f.x,f.y);W.dirty=true}
  }else if(type==="left"){W.r.dir=(W.r.dir+3)%4;W.ta-=90}
  else if(type==="right"){W.r.dir=(W.r.dir+1)%4;W.ta+=90}
  else if(type==="place"){
    if(c==="W"||c==="L"){W.grid[f.y][f.x]="B";W.dirty=true}
    else if(c==="."&&!W.gems.has(f.x+","+f.y)){W.grid[f.y][f.x]="S";W.dirty=true}
  }else if(type==="dig"){
    if(c==="T"){W.grid[f.y][f.x]=".";W.wood++;W.dirty=true}
    else if(c==="S"){W.grid[f.y][f.x]=".";W.dirty=true}
  }
  hud();
}
function check(cond){
  const f=front(),c=tileAt(f.x,f.y);
  if(cond==="tree") return c==="T";
  if(cond==="water") return c==="W";
  return !walkable(c);
}
function* exec(list){
  for(const b of list){
    if(W.got===W.total) return;
    if(b.type==="repeat"){for(let i=0;i<b.n;i++){yield {id:b.id,silent:true};yield* exec(b.body);if(W.got===W.total)return}}
    else if(b.type==="if"){const ok=check(b.cond);yield {id:b.id};if(ok) yield* exec(b.body)}
    else {act(b.type);yield {id:b.id}}
  }
}

/* ---------- running ---------- */
const $=id=>document.getElementById(id);
function status(t,cls){const s=$("status");s.textContent=t;s.className="status"+(cls?" "+cls:"")}
function hud(){$("hGem").textContent=W.got+"/"+W.total;$("hStep").textContent=W.steps;$("hWood").textContent=W.wood}

function run(){
  if(S.running){stop("已停止");return}
  if(!prog().length){status("先從積木箱加入積木吧。","bad");return}
  loadWorld();$("result").hidden=true;
  S.running=true;gen=exec(prog());setRunUI();status("執行中…");
  tick();
}
function tick(){
  let r;
  try{r=gen.next()}catch(e){highlight(curId);return end(false,e.msg||"程式出錯了")}
  if(r.done){
    highlight(null);
    if(W.got===W.total) return end(true);
    const left=W.total-W.got;
    return end(false,`程式跑完了，但還有 ${left} 顆寶石沒拿到。`);
  }
  curId=r.value.id;highlight(curId);
  if(W.got===W.total){timer=setTimeout(()=>end(true),S.fast?200:420);return}
  const delay=r.value.silent?(S.fast?60:140):(S.fast?190:420);
  timer=setTimeout(tick,delay);
}
function stop(msg){clearTimeout(timer);S.running=false;gen=null;highlight(null);setRunUI();if(msg)status(msg)}
function end(win,msg){
  clearTimeout(timer);S.running=false;gen=null;setRunUI();
  if(!win){status(msg,"bad");return}
  highlight(null);
  const L=LEVELS[S.lv],n=count(prog());
  const stars=n<=L.optimal?3:n<=L.optimal+3?2:1;
  progress[S.lv]=Math.max(progress[S.lv]||0,stars);save();renderLevels();
  status(`完成！用了 ${n} 塊積木。`,"good");
  const last=S.lv===LEVELS.length-1;
  const st="★".repeat(stars)+`<span class="off">${"★".repeat(3-stars)}</span>`;
  const tip=stars===3?"積木數量達到最佳解，太厲害了！":`最佳解只要 ${L.optimal} 塊積木，再挑戰看看？`;
  $("result").innerHTML=`<div class="result-card" role="dialog" aria-label="過關">
    <div class="stars" aria-label="${stars} 顆星">${st}</div>
    <h3>${last?"全部關卡完成！":"過關！"}</h3><p>${tip}</p>
    <div class="row"><button class="btn" id="again">再玩一次</button>${last?"":'<button class="btn primary" id="next">下一關 →</button>'}</div></div>`;
  $("result").hidden=false;
  $("again").onclick=()=>{loadWorld();$("result").hidden=true;status("")};
  if(!last)$("next").onclick=()=>goLevel(S.lv+1);
}
function setRunUI(){
  const b=$("runBtn");b.textContent=S.running?"■ 停止":"▶ 執行";b.classList.toggle("stop",S.running);
  $("program").classList.toggle("locked",S.running);
  document.querySelectorAll(".palette .blk").forEach(x=>x.disabled=S.running);
}
function highlight(id){
  document.querySelectorAll(".blk.running").forEach(e=>e.classList.remove("running"));
  document.querySelectorAll(".ln.hot").forEach(e=>e.classList.remove("hot"));
  if(id==null)return;
  const el=document.querySelector(`#program .blk[data-id="${id}"]`);if(el)el.classList.add("running");
  const ln=document.querySelector(`#src .ln[data-id="${id}"]`);if(ln)ln.classList.add("hot");

/* ---------- code generation ---------- */
const sp=(c,t)=>`<span class="t-${c}">${t}</span>`;
const VARS=["i","j","k","m"];
function call(fn,arg){return `robot.${sp("fn",fn)}(${arg?sp("const",arg):""})`}
function stmt(b,lang){
  if(b.type==="forward")return call("forward");
  if(b.type==="left")return call("turn","LEFT");
  if(b.type==="right")return call("turn","RIGHT");
  if(b.type==="place")return call("place","FORWARD");
  if(b.type==="dig")return call("dig","FORWARD");
}
function condExpr(c){
  if(c==="blocked")return call("blocked","FORWARD");
  return `${call("inspect","FORWARD")} == ${sp("const",c==="tree"?"TREE":"WATER")}`;
}
function emit(list,lang,ind,depth,out){
  const pad="    ".repeat(ind);
  for(const b of list){
    if(b.type==="repeat"){
      const v=VARS[depth]||("i"+depth);
      if(lang==="js")out.push([b.id,`${pad}${sp("kw","for")} (${sp("kw","let")} ${v} = ${sp("num",0)}; ${v} < ${sp("num",b.n)}; ${v}++) {`]);
      else out.push([b.id,`${pad}${sp("kw","for")} ${v} ${sp("kw","in")} ${sp("fn","range")}(${sp("num",b.n)}):`]);
      emit(b.body,lang,ind+1,depth+1,out);
      if(lang==="py"&&!b.body.length)out.push([null,`${pad}    ${sp("kw","pass")}`]);
      if(lang==="js")out.push([null,`${pad}}`]);
    }else if(b.type==="if"){
      if(lang==="js")out.push([b.id,`${pad}${sp("kw","if")} (${condExpr(b.cond)}) {`]);
      else out.push([b.id,`${pad}${sp("kw","if")} ${condExpr(b.cond)}:`]);
      emit(b.body,lang,ind+1,depth,out);
      if(lang==="py"&&!b.body.length)out.push([null,`${pad}    ${sp("kw","pass")}`]);
      if(lang==="js")out.push([null,`${pad}}`]);
    }else{
      out.push([b.id,pad+stmt(b,lang)+(lang==="js"?";":"")]);
    }
  }
}
function renderCode(){
  const L=LEVELS[S.lv],lang=S.tab,c=lang==="js"?"//":"#";
  const out=[[null,sp("com",`${c} 第 ${S.lv+1} 關：${L.name}`)]];
  if(!prog().length)out.push([null,sp("com",`${c} 加入積木後，程式碼會出現在這裡`)]);
  emit(prog(),lang,0,0,out);
  $("src").innerHTML=out.map(([id,h])=>`<span class="ln"${id!=null?` data-id="${id}"`:""}>${h||" "}</span>`).join("");
  $("tab-js").setAttribute("aria-selected",lang==="js");$("tab-py").setAttribute("aria-selected",lang==="py");
  if(S.running&&curId!=null)highlight(curId);
}

  if(t.dataset.up){const id=+t.dataset.up,p=parentOf(prog(),id),i=p.findIndex(b=>b.id===id);if(i>0)[p[i-1],p[i]]=[p[i],p[i-1]];renderProgram();return}
});

const cv=$("world");

function hsh(x,y,i){let n=(x*374761393+y*668265263+i*974634)|0;n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967295}
let R3=null;

function tex(draw){

  const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;return t;

  part(new THREE.BoxGeometry(.16,.22,.66),C("#38434E"),-.36,.13,0);
  part(new THREE.BoxGeometry(.16,.22,.66),C("#38434E"),.36,.13,0);
  part(new THREE.BoxGeometry(.04,.22,.04),C("#56636F"),0,.8,.12);
  part(new THREE.BoxGeometry(.1,.1,.1),C("#F2B33D"),0,.94,.12);
  scene.add(robot);

  const terrain=new THREE.Group(),gems=new THREE.Group();scene.add(terrain,gems);

  // drag to orbit (horizontal drags only, so the page still scrolls on phones)
  let dragX=null;
  cv.addEventListener("pointerdown",e=>{dragX=e.clientX;cv.setPointerCapture(e.pointerId)});
  cv.addEventListener("pointermove",e=>{if(dragX==null)return;const dx=e.clientX-dragX;dragX=e.clientX;view.taz-=dx*.01;if(reduce)view.az=view.taz});
  const up=()=>{dragX=null};cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);

  R3={renderer,scene,camera,sun,M,G,robot,body,eyeMat,terrain,gems,water,lava,sparks:[],last:performance.now()};
}

function add(group,geo,mat,x,y,z,cast){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.receiveShadow=true;if(cast)m.castShadow=true;group.add(m);return m}
function buildScene(){
  if(!R3){try{initThree()}catch(e){status("這台裝置無法顯示 3D 畫面，請改用較新的瀏覽器。","bad");return}}
  const {terrain,gems,M,G}=R3;
  terrain.clear();gems.clear();
  W.grid.forEach((row,y)=>row.forEach((c,x)=>{
    if(c==="W"||c==="B"||c==="L"){
      add(terrain,G.box,M.dirt,x,-1.5,y);
      add(terrain,G.liquid,c==="L"?M.lava:M.water,x,-.56,y);
      if(c==="B")add(terrain,G.slab,M.plank,x,-.1,y,true);
    }else{
      add(terrain,G.box,M.grass,x,-.5,y);
      if(c==="S")add(terrain,G.box,M.stone,x,.5,y,true);
      if(c==="T"){add(terrain,G.trunk,M.log,x,.4,y,true);add(terrain,G.leaf,M.leaves,x,1.12,y,true)}
    }
  }));
  W.gems.forEach(s=>{const[x,y]=s.split(",").map(Number);const m=add(gems,G.gem,M.gem,x,.55,y,true);m.userData.seed=x+y});
  W.dirty=false;
  sizeCanvas();
}
function sizeCanvas(){
  if(!R3)return;
  const w=Math.max(200,$("canvasBox").clientWidth),h=Math.round(Math.min(480,Math.max(250,w*.62)));
  R3.renderer.setSize(w,h,false);cv.style.width=w+"px";cv.style.height=h+"px";
  R3.camera.aspect=w/h;R3.camera.updateProjectionMatrix();
}
function placeCamera(){
  const cols=W.grid[0].length,rows=W.grid.length,cam=R3.camera;
  const cx=(cols-1)/2,cz=(rows-1)/2;
  const span=Math.abs(cols*Math.cos(view.az))+Math.abs(rows*Math.sin(view.az));
  const depth=Math.abs(cols*Math.sin(view.az))+Math.abs(rows*Math.cos(view.az));
  const t=Math.tan(cam.fov*Math.PI/360);
  const r=Math.max((span+1.2)/(2*t*cam.aspect),(depth*.75+2)/(2*t))+2.5;
  cam.position.set(cx+r*Math.cos(view.el)*Math.sin(view.az),r*Math.sin(view.el),cz+r*Math.cos(view.el)*Math.cos(view.az));
  cam.lookAt(cx,0,cz);
  R3.sun.position.set(cx-5,12,cz+7);R3.sun.target.position.set(cx,0,cz);
}
function burst(x,y){
  if(!R3)return;
  for(let i=0;i<14;i++){const m=new THREE.Mesh(R3.G.spark,R3.M.spark.clone());m.position.set(x,.55,y);
    const a=Math.PI*2*i/14;m.userData={vx:Math.cos(a)*.035,vy:.05+Math.random()*.03,vz:Math.sin(a)*.035,l:1};R3.scene.add(m);R3.sparks.push(m)}
}
function frame(ms){
  requestAnimationFrame(frame);
  if(!W||!R3)return;
  if(W.dirty)buildScene();
  const t=ms/1000,dt=Math.min(.05,(ms-R3.last)/1000);R3.last=ms;
  const d=W.disp,k=reduce?1:.18;
  d.x+=(W.r.x-d.x)*k;d.y+=(W.r.y-d.y)*k;d.a+=(W.ta-d.a)*k;
  view.az+=(view.taz-view.az)*(reduce?1:.15);
  const dist=Math.min(1,Math.hypot(W.r.x-d.x,W.r.y-d.y));
  const here=tileAt(W.r.x,W.r.y);
  W.sink=(W.sink||0)+((W.fail&&(here==="W"||here==="L")?-.75:0)-(W.sink||0))*.08;
  let sx=0;if(W.shake>0){sx=Math.sin(t*60)*W.shake*.06;W.shake=Math.max(0,W.shake-.02)}
  R3.robot.position.set(d.x+sx,(reduce?0:Math.sin(dist*Math.PI)*.32)+W.sink,d.y);
  R3.robot.rotation.y=-d.a*Math.PI/180;
  R3.eyeMat.color.set(W.fail?"#FF6A4D":"#6FF0C3");
  R3.gems.children.forEach(m=>{if(!reduce){m.rotation.y=t*1.6;m.position.y=.55+Math.sin(t*2.6+m.userData.seed)*.07}});
  if(!reduce){R3.water.offset.set(t*.04,t*.02);R3.lava.offset.set(t*.02,-t*.015)}
  R3.sparks=R3.sparks.filter(m=>{const u=m.userData;m.position.x+=u.vx;m.position.y+=u.vy;m.position.z+=u.vz;u.vy-=.003;u.l-=.025;m.material.opacity=Math.max(0,u.l);
    if(u.l<=0){R3.scene.remove(m);m.material.dispose();return false}return true});
  placeCamera();
  R3.renderer.render(R3.scene,R3.camera);
}
function rotateView(step){view.taz+=step*Math.PI/4}

/* ---------- logo ---------- */
(()=>{const c=$("logo").getContext("2d");const g=["#5BA04A","#4B8B3C","#6FB95A"];
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){c.fillStyle=y<5?g[(x*7+y*3)%5===0?1:(x+y)%7===0?2:0]:((x*5+y*3)%7===0?"#6E4A2A":"#8A5F37");c.fillRect(x,y,1,1)}
  c.fillStyle="#4CD9E3";c.fillRect(6,8,4,4);c.fillStyle="#EFFFFF";c.fillRect(7,9,1,1)})();

/* ---------- boot ---------- */
let startLv=0;try{const v=+localStorage.getItem(KEY+"-lv");if(v>=0&&v<LEVELS.length)startLv=v}catch(e){}
goLevel(startLv);
buildScene();
status("範例：程式裡已經有 1 塊「前進」，再加 2 塊然後按 ▶ 執行。");
if(startLv!==0)status("");
addEventListener("resize",()=>{if(W)sizeCanvas()});
$("rotL").onclick=()=>rotateView(1);$("rotR").onclick=()=>rotateView(-1);
requestAnimationFrame(frame);
})();
</script>
</body>
